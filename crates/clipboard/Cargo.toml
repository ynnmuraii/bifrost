[package]
name = "clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The payload hash travels in `ClipboardComplete.sha256`, and `identity` already hashes
# with ring, so this adds no new crate to the graph.
ring = { version = "0.17", default-features = false, features = ["alloc"] }

