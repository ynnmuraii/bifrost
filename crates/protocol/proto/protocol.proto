syntax = "proto3";
package bifrost.v1;

// Design draft v0.3. Limits and semantic validation are in 05-protocol.md.
// Field numbers are never reused; removed fields are reserved. Enum-value and
// field renames are wire-compatible (numbers unchanged).
// v0.3 semantics: links form a full mesh among workspace members (N_max = 4,
// 3 nodes supported and tested in MVP; a 5th is refused) instead
// of a star around a fixed source; roles (source/receiver) are per-lease, not per
// node; one owner node at a time drives input and authors the layout document.
// There is no compatibility shim for earlier drafts of this document: none of
// them was ever implemented, so v0.3 is the first wire contract.
// This is not an implementation or compatibility promise with another KVM.

message Envelope {
  uint32 major = 1;
  uint32 minor = 2;
  bytes connection_id = 3; // exactly 16 bytes, chosen by the dialing node
  uint64 seq = 4;          // starts at 1, per direction per channel, contiguous
  bytes lease_id = 5;      // exactly 16 on lease messages, empty otherwise
  oneof payload {          // empty payload (e.g. unknown field) => ERROR_CODE_INVALID_FRAME
    Hello hello = 10;
    Topology topology = 11;
    EnterPrepare enter_prepare = 12;
    EnterAck enter_ack = 13;
    EnterCommit enter_commit = 14;
    Leave leave = 15;              // allowed in both directions
    LeaveAck leave_ack = 16;
    InputBatch input_batch = 17;
    InjectAck inject_ack = 18;
    LeaseChallenge lease_challenge = 19;
    LeaseRenew lease_renew = 20;
    LeaseStatus lease_status = 21;
    StateSnapshot state_snapshot = 22;
    ProtocolError error = 23;
    Shutdown shutdown = 24;
    ClipboardGrant clipboard_grant = 25;
    ClipboardBind clipboard_bind = 26;
    ClipboardOffer clipboard_offer = 27;
    ClipboardRequest clipboard_request = 28;
    ClipboardData clipboard_data = 29;
    ClipboardComplete clipboard_complete = 30;
    ClipboardCancel clipboard_cancel = 31;
    DisplaysChanged displays_changed = 32;   // any member -> all links (own displays)
    TopologyApplied topology_applied = 33;   // any member -> coordinator
    OwnerClaim owner_claim = 34;             // any member -> peers
    OwnerState owner_state = 35;             // owner -> all links
    LayoutEdit layout_edit = 36;             // editing member -> coordinator
    TopologyRequest topology_request = 37;   // member -> coordinator (current revision), or coordinator -> author of a newer stored revision
    Ping ping = 38;                          // link liveness
    Pong pong = 39;
    ActiveLayout active_layout = 40;         // receiver -> owner: receiver's active keyboard layout
    CapabilitiesChanged capabilities_changed = 41; // member -> all established input links
    UpdateRequest update_request = 42;       // only to peers advertising REMOTE_UPDATE
    UpdateResult update_result = 43;         // only to peers advertising REMOTE_UPDATE
    ClipboardApplied clipboard_applied = 44; // only to peers advertising CLIPBOARD_APPLY_ACK
    ClipboardRoute clipboard_route = 45;     // metadata-only routing; same capability gate
    Unpaired unpaired = 46; // authenticated sender revokes only its own pairing
    AudioControl audio_control = 59; // bounded auxiliary metadata; never samples
  }
}

// Unused in v0.3: the owner/follower relation is a workspace-wide ownership state
// (OwnerState), and source/receiver are per-lease roles derived from the direction
// of EnterPrepare. Values are kept so numbers are never reused.
enum Role { ROLE_UNSPECIFIED = 0; ROLE_SOURCE = 1; ROLE_RECEIVER = 2; }

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CAPTURE = 1;
  CAPABILITY_INJECT = 2;
  CAPABILITY_ABSOLUTE_POINTER = 3;
  CAPABILITY_PHYSICAL_HID_KEYS = 4;
  CAPABILITY_TEXT_CLIPBOARD = 5;
  CAPABILITY_NATIVE_REPEAT = 6;
  CAPABILITY_SOFTWARE_REPEAT = 7;
  CAPABILITY_RECEIVER_TAKEOVER = 8;
  CAPABILITY_DISPLAYS_CHANGED = 9;
  // Source can always release capture with a local hotkey, without core or network.
  // Absent on a Wayland source whose compositor exposes no GlobalShortcuts backend.
  CAPABILITY_EMERGENCY_HOTKEY = 10;
  CAPABILITY_REMOTE_UPDATE = 11;
  CAPABILITY_CLIPBOARD_APPLY_ACK = 12;
  CAPABILITY_UNPAIR_NOTICE = 13;
  CAPABILITY_CLIPBOARD_SESSION = 14;
  CAPABILITY_CLIPBOARD_IMAGE = 15;
  CAPABILITY_AUDIO_CONTROL_V1 = 16;
  CAPABILITY_SYSTEM_AUDIO_SOURCE = 17;
  CAPABILITY_MIC_CONTROL_V1 = 18;
  CAPABILITY_AUDIO_FOCUS_REPORT_V1 = 19;
  CAPABILITY_AUDIO_LISTENER = 20;
  // Future: 21 mic-stream, 22 virtual-mic.
  CAPABILITY_MEDIA_CONTROL_V1 = 23;
}

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_WINDOWS = 1;
  SESSION_KIND_X11 = 2;       // a real X server; a DISPLAY alone is not proof
  SESSION_KIND_XWAYLAND = 3;  // reported for diagnostics; never Ready
  SESSION_KIND_WAYLAND = 4;   // GNOME and KDE share this value: backend differences are capability bits
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_WRONG_ROLE = 2;
  ERROR_CODE_UNKNOWN_PEER = 3;
  ERROR_CODE_CHANGED_KEY = 4;
  ERROR_CODE_UNSUPPORTED_SESSION = 5;
  ERROR_CODE_CAPTURE_FAILED = 6;
  ERROR_CODE_INVALID_TOPOLOGY = 7;
  ERROR_CODE_TOPOLOGY_CHANGED = 8;
  ERROR_CODE_INVALID_FRAME = 9;
  ERROR_CODE_INVALID_SEQUENCE = 10;
  ERROR_CODE_LEASE_MISMATCH = 11;
  ERROR_CODE_INJECTION_FAILED = 12;
  ERROR_CODE_LEASE_EXPIRED = 13;
  ERROR_CODE_AGENT_LOST = 14;
  ERROR_CODE_CLIPBOARD_TOO_LARGE = 15;
  ERROR_CODE_CLIPBOARD_DISABLED = 16;
  ERROR_CODE_UNSUPPORTED_KEY = 17;
  ERROR_CODE_RATE_LIMITED = 18;
  // User dismissed/denied the desktop portal dialog (capture or injection session).
  ERROR_CODE_PORTAL_DENIED = 19;
  ERROR_CODE_NOT_OWNER = 20;          // EnterPrepare from a node that is not the owner
  ERROR_CODE_STALE_OWNER_SERIAL = 21; // claim/lease carries an owner serial older than known
  ERROR_CODE_LAYOUT_CONFLICT = 22;    // LayoutEdit base revision/author is not current
  ERROR_CODE_MEMBERSHIP_FULL = 23;    // N_max = 4 reached (max_members <= 4); link refused
  ERROR_CODE_NO_COORDINATOR = 24;     // no owner reachable to apply a layout edit
  ERROR_CODE_CANNOT_OWN = 25;         // OwnerClaim from a node whose Hello.can_own = false; the claim is refused
  ERROR_CODE_CLIPBOARD_SUPERSEDED = 26; // a newer local copy cancels a pending incoming offer
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_RETURN_EDGE = 1;
  LEAVE_REASON_HOTKEY = 2;
  LEAVE_REASON_EMERGENCY = 3;
  LEAVE_REASON_RECEIVER_LOCAL_INPUT = 4; // receiver -> source, takeover
  LEAVE_REASON_AGENT_LOST = 5;
  LEAVE_REASON_TOPOLOGY_CHANGED = 6;
  LEAVE_REASON_SUSPEND_OR_LOCK = 7;
  LEAVE_REASON_SHUTDOWN = 8;
  LEAVE_REASON_OWNERSHIP_LOST = 9; // a higher (serial, node_id) owner appeared
}

message Hello {
  bytes node_id = 1;                       // exactly 32: SHA256(SPKI DER)
  string display_name = 2;                 // UTF-8 <= 128 bytes, non-authoritative
  reserved 3; reserved "role";             // role is per-lease in v0.3
  // Max 64 wire entries, counting unknown values and duplicates. The <=22
  // assigned/planned capabilities leave headroom; growing this bound requires
  // a major/minor-gated wire contract change.
  repeated Capability capabilities = 4;
  repeated Display displays = 5;           // max 16
  // Requirements must be distinct, non-UNSPECIFIED, and a subset of capabilities;
  // violations => ERROR_CODE_INVALID_FRAME. Unknown requirements or requirements
  // absent from the receiver's advertised implementation => ERROR_CODE_UNSUPPORTED_VERSION.
  // Unknown optional capabilities remain ignorable; runtime opt-in is independent.
  // Each receiver also requires its own requirements to appear in the peer's offer,
  // even if the peer sends no requirements (including the 0.4.0 Hello shape).
  // Missing peer support => ERROR_CODE_UNSUPPORTED_VERSION.
  repeated Capability required_capabilities = 6; // max 32, checked before membership scans
  SessionKind session_kind = 7;
  uint64 displays_revision = 8;            // local counter of own display set
  uint64 owner_serial = 9;                 // last known owner claim serial (0 = none)
  bytes owner_node_id = 10;                // last known owner (32 bytes, empty = none)
  bool can_own = 11;                       // this node may claim ownership
  uint64 topology_revision = 12;           // applied layout revision
  bytes topology_author = 13;              // author node_id of the applied revision
  string system_name = 14;                 // optional short OS name/version, non-authoritative
  string app_version = 15;                 // optional canonical semver, <= 32 bytes; invalid => unknown
  bytes clipboard_epoch = 16;              // random16 per process; required with CLIPBOARD_SESSION
}

// Replaces only the sender's advertised capability set, not its identity or Hello.
// The same 64-entry wire bound applies, counting unknown values and duplicates.
message CapabilitiesChanged { repeated Capability capabilities = 1; }

// Audio is independent of input leases. Only endpoints' UDP ports travel here:
// the destination IP is inherited from the authenticated parent TLS connection.
message AudioControl {
  uint32 control_version = 1; // exactly 1; complete message <= 2048 bytes
  oneof body {
    AudioHello hello = 10;
    AudioOffer offer = 11;
    AudioAnswer answer = 12;
    AudioCommit commit = 13;
    AudioStop stop = 14;
    AudioKeepalive keepalive = 15;
    AudioReport report = 16;
    AudioFocusSnapshot focus = 17;
    MicState mic_state = 18;
    MicAck mic_ack = 19;
    AudioConsentChanged consent = 20;
    AudioFocusRequest focus_request = 21;
    MediaInfo media_info = 22;
    MediaCommand media_command = 23;
    MediaAck media_ack = 24;
    AudioStartRequest start_request = 25; // Source asks Listener to create a normal Offer
    AudioStartRefusal start_refusal = 26; // request correlation, never a session stop
    MicControl mic_control = 27;
  }
}
message AudioFocusSnapshot {
  bytes owner_node_id = 1; //32, authenticated current owner
  uint64 owner_serial = 2; //positive; revision namespace
  uint64 focus_revision = 3; //positive, monotonic within owner namespace
  bytes active_node_id = 4; //empty when unknown, otherwise32
  bytes lease_id = 5; //16 for committed remote; empty for idle owner/unknown
  bool committed = 6; //false requires empty active and lease
}
message AudioFocusRequest {
  bytes group_id = 1; //16
}
enum AudioNodeRole {
  AUDIO_NODE_ROLE_UNSPECIFIED = 0;
  AUDIO_NODE_ROLE_SOURCE = 1;
  AUDIO_NODE_ROLE_LISTENER = 2;
}
enum AudioStreamKind {
  AUDIO_STREAM_KIND_UNSPECIFIED = 0;
  AUDIO_STREAM_KIND_SYSTEM = 1;
  // Future: 2 microphone.
}
enum AudioStopCode {
  AUDIO_STOP_CODE_UNSPECIFIED = 0;
  AUDIO_STOP_CODE_DISABLED = 1;
  AUDIO_STOP_CODE_CONSENT_REQUIRED = 2;
  AUDIO_STOP_CODE_ROLE_CONFLICT = 3;
  AUDIO_STOP_CODE_UNSUPPORTED_FORMAT = 4;
  AUDIO_STOP_CODE_DEVICE_UNAVAILABLE = 5;
  AUDIO_STOP_CODE_VIRTUAL_MIC_MISSING = 6;
  AUDIO_STOP_CODE_PARENT_LOST = 7;
  AUDIO_STOP_CODE_WORKER_LOST = 8;
  AUDIO_STOP_CODE_TIMEOUT = 9;
  AUDIO_STOP_CODE_RATE_LIMITED = 10;
  AUDIO_STOP_CODE_REVOKED = 11;
  AUDIO_STOP_CODE_USER_STOP = 12;
  AUDIO_STOP_CODE_PROTOCOL_VIOLATION = 13;
  AUDIO_STOP_CODE_GROUP_MISMATCH = 14;
}
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_OPUS = 1;
}
enum AudioAead {
  AUDIO_AEAD_UNSPECIFIED = 0;
  AUDIO_AEAD_CHACHA20_POLY1305 = 1;
}
enum AudioLatencyProfile {
  AUDIO_LATENCY_PROFILE_UNSPECIFIED = 0;
  AUDIO_LATENCY_PROFILE_ETHERNET = 1;
  AUDIO_LATENCY_PROFILE_WIFI = 2;
}
enum AudioDeviceState {
  AUDIO_DEVICE_STATE_UNSPECIFIED = 0;
  AUDIO_DEVICE_STATE_READY = 1;
  AUDIO_DEVICE_STATE_UNAVAILABLE = 2;
  AUDIO_DEVICE_STATE_REBUFFERING = 3;
}
message AudioFormat {
  uint32 media_version = 1;
  AudioCodec codec = 2;
  uint32 sample_rate = 3;
  uint32 channels = 4;
  uint32 frame_samples = 5;
  uint32 bitrate_bps = 6;
  bool fec = 7;
  AudioLatencyProfile profile = 8;
  uint32 max_datagram_bytes = 9;
  AudioAead aead = 10;
}
message AudioHello {
  bytes group_id = 1; // Listener:16; unresolved Source: empty or16
  bytes listener_node_id = 2; // selected Listener, exactly32
  AudioNodeRole role = 3;
  uint32 udp_port = 4;
  repeated uint32 media_versions = 5; // 1..4 distinct nonzero, includes1
  uint32 consent_revision = 6;
  uint32 directions = 7; // send1, receive2; permissions, not activation
  bool listener_available = 8;
}
message AudioOffer {
  bytes session_id = 1; //16
  bytes session_nonce = 2; //32, fresh Listener contribution
  bytes parent_connection_id = 3; //16, must match authenticated envelope
  bytes group_id = 4; //16
  bytes listener_node_id = 5; //32
  bytes source_node_id = 6; //32
  AudioStreamKind kind = 7;
  AudioFormat format = 8;
  uint32 udp_port = 9;
  uint32 consent_revision = 10;
  uint32 key_epoch = 11; //1
  uint32 control_ttl_ms = 12; //3000
  bytes request_id = 13; // empty for Listener start, otherwise16; not key context
}
message AudioStartRequest {
  bytes request_id = 1; //16, unique for this authenticated parent generation
  bytes group_id = 2; //16
  bytes source_node_id = 3; //32, authenticated sender
  uint32 consent_revision = 4;
  AudioStreamKind kind = 5; //System
  AudioLatencyProfile profile = 6;
}
message AudioStartRefusal {
  bytes request_id = 1; //16; never interpreted as session_id
  AudioStopCode reason = 2; //known nonzero
}
message AudioAnswer {
  bytes session_id = 1;
  bool accepted = 2;
  AudioStopCode reason = 3; // accepted:0; refused:known nonzero
  AudioFormat accepted_format = 4; // absent on refusal
  uint32 udp_port = 5; // zero on refusal
  uint32 consent_revision = 6;
  bytes source_nonce = 7; // accepted: fresh32; refusal:empty
}
message AudioCommit {
  bytes session_id = 1;
  bytes transcript_sha256 = 2; //32
  uint32 key_epoch = 3; //1
  bool start_muted = 4;
}
message AudioStop {
  bytes session_id = 1;
  AudioStopCode reason = 2;
}
message AudioKeepalive {
  bytes session_id = 1;
  uint64 control_serial = 2;
  uint32 authorized_for_ms = 3; //1..3000
}
message AudioReport {
  bytes session_id = 1;
  uint64 received_packets = 2;
  uint64 lost_packets = 3;
  uint32 buffer_ms = 4; // <=1000
  uint32 underruns = 5;
  uint32 suggested_loss_pct = 6; // <=100
  AudioDeviceState device_state = 7;
}
message AudioConsentChanged {
  bytes group_id = 1;
  uint32 consent_revision = 2;
  uint32 allowed_directions = 3;
}

enum AudioControlResult {
  AUDIO_CONTROL_RESULT_OK = 0;
  AUDIO_CONTROL_RESULT_DISABLED = 1;
  AUDIO_CONTROL_RESULT_CONSENT_REQUIRED = 2;
  AUDIO_CONTROL_RESULT_STALE_REVISION = 3;
  AUDIO_CONTROL_RESULT_UNSUPPORTED = 4;
  AUDIO_CONTROL_RESULT_DEVICE_GONE = 5;
  AUDIO_CONTROL_RESULT_CONFLICT = 6;
  AUDIO_CONTROL_RESULT_EXPIRED = 7;
  AUDIO_CONTROL_RESULT_BUSY = 8;
  AUDIO_CONTROL_RESULT_TIMEOUT = 9;
  AUDIO_CONTROL_RESULT_CANCELLED = 10;
  AUDIO_CONTROL_RESULT_INVALID = 11;
}
enum MicControlOp {
  MIC_CONTROL_OP_UNSPECIFIED = 0;
  MIC_CONTROL_OP_SET_MUTE = 1;
  MIC_CONTROL_OP_PRESS = 2;
  MIC_CONTROL_OP_RENEW = 3;
  MIC_CONTROL_OP_RELEASE = 4;
}
message MicControl {
  bytes group_id = 1;
  bytes request_id = 2;
  uint64 expected_revision = 3;
  MicControlOp op = 4;
  bool muted = 5;
  bytes press_id = 6;
  uint64 challenge = 7;
  uint64 expires_ns = 8; // Listener-issued absolute monotonic deadline; echoed unchanged
}
message MicState {
  bytes group_id = 1;
  uint64 revision = 2;
  bool muted = 3;
  bool ptt_enabled = 4;
  bool ptt_active = 5;
  bool supported = 6;
  AudioControlResult reason = 7;
  bytes controller_node_id = 8;
  bytes press_id = 9;
  uint64 challenge = 10;
  uint64 expires_ns = 11;
  bool desired_muted = 12;
}
message MicAck {
  bytes group_id = 1;
  bytes request_id = 2;
  uint64 revision = 3;
  AudioControlResult result = 4;
}
enum MediaPlayback {
  MEDIA_PLAYBACK_STOPPED = 0;
  MEDIA_PLAYBACK_PLAYING = 1;
  MEDIA_PLAYBACK_PAUSED = 2;
  MEDIA_PLAYBACK_UNKNOWN = 3;
}
enum MediaCommandKind {
  MEDIA_COMMAND_KIND_UNSPECIFIED = 0;
  MEDIA_COMMAND_KIND_PLAY = 1;
  MEDIA_COMMAND_KIND_PAUSE = 2;
  MEDIA_COMMAND_KIND_PLAY_PAUSE = 3;
  MEDIA_COMMAND_KIND_NEXT = 4;
  MEDIA_COMMAND_KIND_PREVIOUS = 5;
}
message MediaInfo {
  bytes session_id = 1;
  bool present = 2;
  uint64 token = 3;
  uint64 revision = 4;
  string app = 5; // <=128 UTF-8 bytes; never log/persist metadata
  string title = 6; // <=256
  string subtitle = 7; // <=256
  optional uint64 position_ms = 8;
  optional uint64 duration_ms = 9;
  MediaPlayback playback = 10;
  uint32 commands = 11; // Play, Pause, PlayPause, Next, Previous: bits0..4
  bool allow_control = 12; // Source-authoritative peer permission, not inferred from OS commands.
}
message MediaCommand {
  bytes request_id = 1;
  bytes session_id = 2;
  uint64 token = 3;
  uint64 revision = 4;
  MediaCommandKind command = 5;
}
message MediaAck {
  bytes request_id = 1;
  bytes session_id = 2;
  AudioControlResult result = 3;
}

// Only a version is supplied: releases are resolved from the receiver's trusted source.
message UpdateRequest { string target_version = 1; }
message UpdateResult {
  string target_version = 1;
  string status = 2; // pending | downloading | restarting | done | refused | unreachable
  string detail = 3;
}

message Unpaired {
  bytes requester_node_id = 1; // exactly 32; must match the mTLS sender
  string reason = 2; // informational only, at most 128 UTF-8 bytes
}

message Rect { double x = 1; double y = 2; double width = 3; double height = 4; }

message PhysicalSize { double width_mm = 1; double height_mm = 2; string source = 3; }

enum MapSizeMode { MAP_SIZE_MODE_LEGACY = 0; MAP_SIZE_MODE_AUTO = 1; MAP_SIZE_MODE_MANUAL = 2; }
enum BridgeDecision { BRIDGE_DECISION_ENABLED = 0; BRIDGE_DECISION_DISABLED = 1; }
message DisplayMap {
  string node_id = 1;
  string display_id = 2;
  Rect rect = 3;
  MapSizeMode size_mode = 4;
  optional double diagonal_inches = 5;
}
message BridgeEndpoint { string node_id = 1; string display_id = 2; Edge edge = 3; }
message BridgeRule { BridgeEndpoint a = 1; BridgeEndpoint b = 2; BridgeDecision decision = 3; }
message MapDocument { repeated DisplayMap displays = 1; repeated BridgeRule bridges = 2; }
// Authored links retain ids, direction and offline/disabled endpoints independently of runtime.
message AuthoredLink {
  string id = 1;
  Endpoint from = 2;
  Endpoint to = 3;
  bool bidirectional = 4;
}

message Display {
  string id = 1;                 // stable within node, UTF-8 <= 128 bytes
  Rect logical_bounds = 2;       // node logical space, authoritative for topology
  Rect native_bounds = 3;        // diagnostic when native_known is false
  uint32 rotation_degrees = 4;   // 0, 90, 180, 270
  double scale_x = 5;            // positive finite logical -> native scale, GUI only
  double scale_y = 6;
  bool primary = 7;              // origin of the node logical space
  bool native_known = 8;         // false when the platform exposes logical bounds only (Wayland portals)
  PhysicalSize physical_size = 9;
}

enum Edge { EDGE_UNSPECIFIED = 0; EDGE_LEFT = 1; EDGE_RIGHT = 2; EDGE_TOP = 3; EDGE_BOTTOM = 4; }

message Endpoint {
  bytes node_id = 1;
  string display_id = 2;     // a stable display id, or "auto": that edge of the node's whole
                             // desktop, resolved against the receiver's own manifest. An
                             // "auto" endpoint carries no segment (fields 4/5 are 0).
  Edge edge = 3;
  double segment_start = 4;  // distance along the edge from its start, display logical units
  double segment_end = 5;    // strictly greater than start, <= edge length
}

message TransitionLink {
  Endpoint source_endpoint = 1;
  Endpoint target_endpoint = 2;
}

message Topology {
  uint64 revision = 1;                // authored only by the current owner (coordinator)
  repeated NodeDisplays nodes = 2;
  repeated TransitionLink links = 3;
  bytes author_node_id = 4;           // applied order is (revision, author_node_id)
  repeated bytes forgotten_node_ids = 5; // layout exclusion only; never revokes another member's trust
  MapDocument map = 6;
  repeated AuthoredLink authored_links = 7;
}
message NodeDisplays { bytes node_id = 1; repeated Display displays = 2; bool online = 3; }

message DisplaysChanged {                // a member's own display set changed
  uint64 displays_revision = 1;
  repeated Display displays = 2;
}
message TopologyApplied {
  uint64 revision = 1;
  uint64 request_nonce = 2;   // echoes LayoutEdit.request_nonce when this is the verdict of an
                              // edit; 0 when it only confirms a received document
}

message Position {
  string display_id = 1;
  double x = 2; // local to display top-left, logical units, [0, width)
  double y = 3;
}

message EnterPrepare { uint64 topology_revision = 1; Position position = 2; uint64 owner_serial = 3; }
message EnterAck {
  bool accepted = 1;
  reserved 2; reserved "reason_code";
  ErrorCode reason = 3;           // enum instead of string
}
message EnterCommit {}
message Leave {
  reserved 1; reserved "reason_code";
  LeaveReason reason = 2;
}
message LeaveAck {}

message InputBatch { repeated InputEvent events = 1; } // 1..128
message InputEvent {
  uint64 capture_monotonic_us = 1; // diagnostic origin-clock only
  oneof event {
    Position pointer_absolute = 10;
    Key key = 11;
    Button button = 12;
    Scroll scroll = 13;
  }
}
enum KeyState { KEY_STATE_UNSPECIFIED = 0; KEY_STATE_DOWN = 1; KEY_STATE_UP = 2; }
message Key { uint32 usage_page = 1; uint32 usage = 2; KeyState state = 3; } // page 0x07 only; source drops others
enum ButtonKind {
  BUTTON_KIND_UNSPECIFIED = 0;
  BUTTON_KIND_LEFT = 1;
  BUTTON_KIND_RIGHT = 2;
  BUTTON_KIND_MIDDLE = 3;
  BUTTON_KIND_BACK = 4;
  BUTTON_KIND_FORWARD = 5;
}
message Button { ButtonKind button = 1; KeyState state = 2; }
message Scroll { sint32 horizontal_units120 = 1; sint32 vertical_units120 = 2; }

enum InjectStatus {
  INJECT_STATUS_UNSPECIFIED = 0;
  INJECT_STATUS_OK = 1;
  INJECT_STATUS_PARTIAL = 2;  // lease is aborted
  INJECT_STATUS_FAILED = 3;   // lease is aborted
}
message InjectAck {
  uint64 input_batch_seq = 1;   // Envelope.seq of the acknowledged InputBatch
  uint32 applied_count = 2;
  Position actual_position = 3;
  reserved 4; reserved "error_code";
  InjectStatus status = 5;
}

message LeaseChallenge { bytes nonce = 1; uint32 ttl_ms = 2; } // nonce16
message LeaseRenew { bytes nonce = 1; } // one-use receiver-issued nonce
message LeaseStatus { bytes nonce = 1; bool accepted = 2; uint64 last_input_batch_seq = 3; }
message StateSnapshot {
  repeated Key pressed_keys = 1; // each state KEY_STATE_DOWN
  repeated ButtonKind pressed_buttons = 2;
}
message ProtocolError {
  reserved 1; // string code in earlier drafts; name reused with enum type
  uint64 related_seq = 2;
  ErrorCode code = 3;
  uint64 request_nonce = 4;   // echoes LayoutEdit.request_nonce when this refuses an edit;
                              // 0 for every other protocol error
  uint64 layout_revision = 5; // the applied layout revision when this refuses an edit
                              // (LAYOUT_CONFLICT names what the editor must reload to);
                              // 0 for every other protocol error
}
message Shutdown {
  reserved 1; reserved "reason_code";
  LeaveReason reason = 2;
}

// ---------- Ownership and layout (v0.3) ----------
// The owner is the single node allowed to open leases and to author the layout.
// Correctness order for ownership is the lexicographic pair (serial, node_id):
// a candidate is newer only if it compares greater. Claiming is a Lamport counter,
// not an election: there is no quorum, no voting and no majority.
message OwnerClaim {
  uint64 serial = 1;          // claimant's max_seen_serial + 1
  ClaimReason reason = 2;
}
enum ClaimReason {
  CLAIM_REASON_UNSPECIFIED = 0;
  CLAIM_REASON_STARTUP = 1;   // automatic claim when claim_on_startup = true
  CLAIM_REASON_USER = 2;      // GUI button or claim_hotkey
  CLAIM_REASON_TAKEOVER = 3;  // user took over a physical machine
}
message OwnerState {
  uint64 serial = 1;
  bytes owner_node_id = 2;    // 32 bytes
  bool granted = 3;           // false from a peer that observed a higher candidate, or that refuses the claim (can_own = false by Hello)
}
message LayoutEdit {          // sent by the editing member to the coordinator
  uint64 expected_revision = 1;
  bytes expected_author = 2;  // 32 bytes; the applied (revision, author) pair
  bytes author_node_id = 3;   // informational: who edited in the GUI
  bytes layout_toml = 4;      // full document; validated by the coordinator
  uint64 request_nonce = 5;   // editor's own request id; the verdict echoes it, so two
                              // concurrent edits from one node cannot take each other's answer
}
message TopologyRequest {} // member -> coordinator for the current revision, or coordinator -> the author of a higher stored revision (partition rejoin)
message Ping { uint64 nonce = 1; }
message Pong { uint64 nonce = 1; }

// Receiver-owned keyboard layout (ADR-006). Sent receiver -> owner after
// EnterAck{accepted} and on every change of the receiver's active layout while the
// lease is alive, so the owner's GUI can show "typing goes to <PC>, layout <xx>".
message ActiveLayout {
  string layout_id = 1;        // receiver-owned, e.g. "us", "ru", "de(nodeadkeys)"; UTF-8 <= 64 bytes
  uint64 layout_revision = 2;  // monotonic counter of the receiver's own layout changes
}

message ClipboardGrant {
  bytes channel_id = 1;
  bytes binding_token = 2;
  uint32 ttl_ms = 3;
  uint32 clipboard_port = 4;   // the port the granting node's clipboard listener is bound to;
                               // 0 = the default 47902. `network.port_clipboard` is configurable,
                               // so the dialer may not assume the default: it connects to the
                               // address the input link comes from, at this port.
}
message ClipboardBind {
  bytes parent_connection_id = 1;
  bytes channel_id = 2;
  bytes binding_token = 3;
}
message ClipboardOffer {
  bytes offer_id = 1;          // random16
  bytes origin_node_id = 2;    // 32 bytes
  uint64 origin_version = 3;
  string mime = 4;             // exact text/plain;charset=utf-8 or image/png (capability 15)
  uint64 size_bytes = 5;       // text <= 1048576; PNG <= 33554432
  reserved 6; reserved "sha256"; // hash moved to ClipboardComplete
  bool secret_marked = 7;     // never retain this transfer in clipboard history
  bytes sender_epoch = 8;     // authenticated sender's Hello.clipboard_epoch, capability gated
  bool relayed = 9;           // explicit relay authority; replay namespace remains the TLS sender
}
message ClipboardRequest { bytes offer_id = 1; }
message ClipboardData {
  bytes offer_id = 1;
  uint32 chunk_index = 2;      // zero-based
  uint32 chunk_count = 3;      // text 1..64; PNG 1..2048, fixed by accepted offer
  bytes data = 4;              // <= 16384 bytes
}
message ClipboardComplete { bytes offer_id = 1; bytes sha256 = 2; }
message ClipboardApplied { uint64 origin_version = 1; bytes sha256 = 2; bool ok = 3; string detail = 4; }
// action: carry | clear | deliver | pending | failed | addressed; never carries clipboard content.
message ClipboardRoute {
  string action = 1;
  bytes origin_node_id = 2;
  uint64 origin_version = 3;
  bytes sha256 = 4;
  bytes target_node_id = 5;
}
message ClipboardCancel {
  bytes offer_id = 1;
  reserved 2; reserved "reason_code";
  ErrorCode reason = 3;
}

// ---------- Pairing: ALPN bifrost/pair/1, max frame 8192 bytes ----------
message PairingEnvelope {
  uint64 seq = 1;
  bytes attempt_id = 2;        // random16 from the window opener (TLS server), lifetime 120 s
  uint32 major = 3;
  uint32 minor = 4;
  oneof payload {
    PairHello hello = 10;      // the node that opened the pairing window (TLS server) sends first; the dialer replies
    PairDecision decision = 11;
    ProtocolError error = 12;
    PairRequest request = 13; // request ALPN only; never grants trust
    PairRequestAck request_ack = 14;
    PairReveal reveal = 15; // commitment ceremony v1 only, after both Hello commitments
  }
}
message PairHello {
  bytes node_id = 1;           // must equal SHA256 of actual TLS peer SPKI
  string display_name = 2;
  reserved 3; reserved "desired_role"; // roles are per-lease in v0.3
  bool supports_sas = 4;       // 6-digit comparison code from TLS exporter
  uint32 listen_port = 5;      // input/control port the sender listens on; 0 = default 47901
  uint32 sas_ceremony_version = 6; // 0 = legacy exporter SAS; 1 = SHA-256 commitment/reveal
  bytes sas_commitment = 7;    // exactly 32 for version 1, empty for legacy
}
message PairReveal {
  bytes contribution_id = 1; // fresh random16 per side and TLS connection
  bytes nonce = 2;           // fresh random32, secret until both commitments are received
}
message PairDecision {
  bool approved = 1;           // only after local user decision
  bytes peer_node_id = 2;
}

// Separate request ALPN uses the same bounded framing, not a trusted session.
message PairRequest {
  bytes requester_node_id = 1;
  string display_name = 2;
  string system_name = 3;
  string app_version = 4;
}
message PairRequestAck {
  string status = 1; // pending | accepted | declined | busy | disabled | timeout
}
