syntax = "proto3";
package lan_workspace.ipc.v1;

// Local IPC of Bifrost: lws-core <-> lws-agent (AgentFrame) and
// lws-core <-> lws-gui (GuiFrame). See 03-architecture.md, section "Локальный IPC".
// Framing: 4-byte unsigned big-endian length + serialized AgentFrame / GuiFrame.
// Max frame: 65536 bytes. Never sent over the network.
// Backend selection and portal restore tokens travel in AgentAttach; portal
// messages carry no key, pointer or clipboard payload, only interface names,
// versions and opaque tokens.

// ---------- core <-> input-agent ----------
message AgentFrame {
  uint32 major = 1;
  uint32 minor = 2;
  uint64 seq = 3; // per direction, starts at 1, contiguous
  oneof msg {
    // core -> agent
    AgentAttach attach = 10;
    BeginCapture begin_capture = 11;
    EndCapture end_capture = 12;
    PrepareInject prepare_inject = 13;
    Inject inject = 14;
    ArmDeadline arm_deadline = 15;
    ReleaseSession release_session = 16;
    ReleaseKeys release_keys = 17;
    QueryDisplays query_displays = 18;
    AgentShutdown shutdown = 19;
    Ping ping = 20;
    ForgetPortalGrants forget_portal_grants = 21; // drop stored restore tokens, re-ask the user
    StopRepeat stop_repeat = 22; // AC-14: `repeat_guard_ms` silent, stop repeating/let the keys up
    SetClipboardText set_clipboard_text = 23; // core -> agent: own the local CLIPBOARD and put this text on it
    EdgeFx edge_fx = 24;                 // edge-effect frame for the overlay (cosmetic, rate-limited by core)
    SetEffects set_effects = 25;         // live `[appearance]` update
    SetHotkeys set_hotkeys = 26;         // transactional live shortcut registration

    // agent -> core
    AgentReady ready = 40;
    CaptureReady capture_ready = 41;
    CapturedBatch captured = 42;
    EmergencyFired emergency = 43;
    InjectResult inject_result = 44;
    DeadlineExpired deadline_expired = 45;
    Released released = 46;
    DisplaysReport displays = 47;
    LocalInputDetected local_input = 48;
    SessionEvent session_event = 49;
    Pong pong = 50;
    AgentError error = 51;
    PortalPermissionRequired portal_permission = 52; // GUI hint: a permission dialog is expected
    PortalGrantChanged portal_grant = 53;            // fresh restore token to persist
    ClipboardChanged clipboard_changed = 54;         // the local clipboard changed; core offers it to the peers
    PortalPermissionRestoring portal_permission_restoring = 55; // a persisted restore token is being applied; no dialog is expected
    HotkeysResult hotkeys_result = 56;
    HotkeyPressed hotkey_pressed = 57;
    GameGuardSignals game_guard_signals = 58;
    ClipboardApplied clipboard_applied = 59;         // sent after validated text reaches the backend
  }
}

enum AgentMode {
  AGENT_MODE_UNSPECIFIED = 0;
  AGENT_MODE_NORMAL = 1;
  AGENT_MODE_RECOVERY = 2; // only ReleaseKeys / Shutdown accepted
}

// Platform backend selection from config; the agent still verifies the environment.
enum BackendKind {
  BACKEND_KIND_UNSPECIFIED = 0;
  BACKEND_KIND_AUTO = 1;    // default: detect Windows / X11 / Wayland
  BACKEND_KIND_X11 = 2;     // override; refused if the session is Wayland/Xwayland
  BACKEND_KIND_WAYLAND = 3; // override; refused if the session is a real X11 session
}

message PortalGrant {
  string portal_interface = 1; // org.freedesktop.portal.InputCapture / RemoteDesktop
  string restore_token = 2;    // opaque, persisted by core; never logged or exported
  string compositor_signature = 3; // compositor + portal version at issue time
}

message AgentAttach {
  bytes launch_token = 1; // 32 random bytes, passed via inherited pipe/stdin, never argv
  AgentMode mode = 2;
  string emergency_hotkey = 3; // e.g. "Ctrl+Alt+Shift+F12"
  BackendKind backend_override = 4;
  repeated PortalGrant restore_tokens = 5; // Wayland only; empty on other backends
  bool require_emergency_hotkey = 6;       // source refuses Remote when the portal lacks it
  uint32 core_silence_ms = 7;              // 200..500, default 300; agent ends capture after this much
                                           // core silence (IPC heartbeat = value / 4, see 03-architecture.md)
  TakeoverDetection takeover_detection = 8; // `[input].takeover_detection`; the agent owns the detector
  uint32 takeover_threshold_px = 9;        // `[input].takeover_threshold_px`: physical movement that ends a lease
  RepeatMode repeat_mode = 10;             // `[input].repeat_mode`: which engine repeats a held key here
  bool allow_portal_sessions = 11;          // false in RECOVERY or after a portal failure until manual retry
  bool edge_effects = 12;                   // `[appearance].edge_effects`
  bool hide_cursor = 13;                    // `[appearance].hide_remote_cursor`
  repeated HotkeyBinding hotkeys = 14;
}

// `[input].repeat_mode`: which side repeats a held key. ADR-006: one engine only — the
// source never sends OS-generated repeats (`agent`/capture filters them), so this chooses
// what the receiver does with a held key the source is still holding.
enum RepeatMode {
  REPEAT_MODE_UNSPECIFIED = 0;
  REPEAT_MODE_RECEIVER_NATIVE = 1;   // the OS repeats the held injected key (X11, Wayland)
  REPEAT_MODE_RECEIVER_SOFTWARE = 2; // the agent repeats it at the OS rate (Windows: an
                                     // injected key-down does not autorepeat, measured)
}

// `[input].takeover_detection`: how physical input on the receiver is seen. The agent
// evaluates the environment-owned part (an `evdev` detector needs Linux and the `input`
// group), which is why the loader accepts every value.
enum TakeoverDetection {
  TAKEOVER_DETECTION_UNSPECIFIED = 0;
  TAKEOVER_DETECTION_AUTO = 1;  // native detector of the session: Windows hooks / X11 raw events
  TAKEOVER_DETECTION_EVDEV = 2; // opt-in /dev/input reader (Wayland receivers; KVM-028)
  TAKEOVER_DETECTION_OFF = 3;   // never end a lease on local input
}

enum CaptureKind {
  CAPTURE_KIND_UNSPECIFIED = 0;
  CAPTURE_KIND_OBSERVE = 1;   // Local: watch edges, no suppression.
                              // Wayland: keep the InputCapture session armed (barriers set, Enable).
  CAPTURE_KIND_TEMPORARY = 2; // Preparing: Windows/X11/dry keys/buttons pass through, no duplicate replay; self-timeout.
                              // Native Wayland: compositor diverted input; abort = Release + buffered local replay.
  CAPTURE_KIND_REMOTE = 3;    // Remote: suppress, forward to core
}

message BeginCapture {
  CaptureKind kind = 1;
  bytes lease_id = 2;          // 16 bytes for TEMPORARY/REMOTE
  uint32 self_timeout_ms = 3;  // agent ends capture by itself, max 1000;
                               // on Wayland bounds how long an activated (diverted) capture is held
  bool dev_capture_injected = 4; // core dev-only opt-in; meaningful only on the source owner
}
message EndCapture { bytes lease_id = 1; bool replay_buffered_locally = 2; }
message PrepareInject { bytes lease_id = 1; }

message HidKey { uint32 usage_page = 1; uint32 usage = 2; bool down = 3; }
message PointerAbs { string display_id = 1; double x = 2; double y = 3; }
message ButtonEv { uint32 button = 1; bool down = 2; }
message ScrollEv { sint32 h120 = 1; sint32 v120 = 2; }
message LocalEvent {
  uint64 monotonic_us = 1;
  oneof ev { PointerAbs pointer = 10; HidKey key = 11; ButtonEv button = 12; ScrollEv scroll = 13; }
}

message Inject { bytes lease_id = 1; uint64 input_batch_seq = 2; repeated LocalEvent events = 3; }
message ArmDeadline { bytes lease_id = 1; uint32 remaining_ms = 2; } // 1..1000, agent clock
message ReleaseSession { bytes lease_id = 1; }
message ReleaseKeys { repeated HidKey keys = 1; repeated uint32 buttons = 2; } // recovery
message QueryDisplays {}
message AgentShutdown {}
message ForgetPortalGrants {} // drop stored restore tokens and let the portal ask again
// ---------- edge effects (core -> agent; cosmetic, payload-free of input) ----------
// Display-local logical px. PROXIMITY: the pointer is `distance` px from the linked edge segment
// seg_start..seg_end (measured along the edge), `along` is the crossing point; sent at most 30 Hz and only
// within reach of a linked edge. CROSSED: input left this machine (edge/along optional: set when no approach
// was shown). ENTERED: input arrived at `along` on `edge`. LEFT: input left again. CLEAR: stop at once.
enum EdgeFxKind { EDGE_FX_KIND_UNSPECIFIED = 0; EDGE_FX_PROXIMITY = 1; EDGE_FX_CROSSED = 2; EDGE_FX_ENTERED = 3; EDGE_FX_LEFT = 4; EDGE_FX_CLEAR = 5; }
message EdgeFx { EdgeFxKind kind = 1; string display_id = 2; PortalEdge edge = 3; double seg_start = 4; double seg_end = 5; double along = 6; double distance = 7; }
// Live settings (also carried by AgentAttach for the first values).
message SetEffects { bool edge_effects = 1; bool hide_cursor = 2; }
message Ping { uint64 nonce = 1; }

message AgentReady {
  repeated string capabilities = 1;
  string platform = 2;
  string session_kind = 3;
  BackendInfo backend = 4; // structured backend detail, required for capability mapping
}

message PortalInterface { string name = 1; uint32 version = 2; } // D-Bus interface version

message BackendInfo {
  string backend = 1;      // "platform-win" | "platform-x11" | "platform-wayland"
  string compositor = 2;   // "mutter" | "kwin" | "" when not Wayland
  repeated PortalInterface portals = 3;
  bool has_emergency_hotkey = 4;   // GlobalShortcuts available and bound
  bool has_portal_persistence = 5; // restore tokens accepted by the portal
  bool has_receiver_takeover = 6;  // local physical input can end a lease
  bool has_absolute_injection = 7; // EIS absolute pointer region established
  bool has_portal_clipboard = 8;   // session returned clipboard_enabled = true
  string degraded_reason = 9;      // payload-free actionable text when a capability is missing
}
message CaptureReady { bytes lease_id = 1; CaptureKind kind = 2; }
// Portal activation coordinates are node-logical; edge identifies the accepted barrier.
enum PortalEdge { PORTAL_EDGE_UNSPECIFIED = 0; PORTAL_EDGE_LEFT = 1; PORTAL_EDGE_RIGHT = 2; PORTAL_EDGE_TOP = 3; PORTAL_EDGE_BOTTOM = 4; }
message PortalActivation { PointerAbs position = 1; PortalEdge edge = 2; }
// Cumulative discrete edges and wheel events; snapshots are per capture/injection lease,
// not log interval.
message EdgeCounters {
  uint64 keys_down = 1;
  uint64 keys_up = 2;
  uint64 buttons_down = 3;
  uint64 buttons_up = 4;
  // Wheel events that carried vertical units (either sign).
  uint64 wheel_v = 5;
  // Wheel events that carried horizontal units (either sign).
  uint64 wheel_h = 6;
}
message CapturedBatch { repeated LocalEvent events = 1; bool at_edge = 2; PortalActivation activation = 3; EdgeCounters hook_edges = 4; }
message EmergencyFired { bytes lease_id = 1; } // agent has already restored local control
message InjectResult { bytes lease_id = 1; uint64 input_batch_seq = 2; uint32 applied_count = 3; string os_error = 4; PointerAbs actual = 5; EdgeCounters applied_edges = 6; }
message DeadlineExpired { bytes lease_id = 1; }
message Released { bytes lease_id = 1; uint32 keys_released = 2; uint32 buttons_released = 3; }
message DisplaysReport { repeated DisplayInfo displays = 1; uint64 local_revision = 2; }
message DisplayInfo {
  string id = 1;
  double lx = 2; double ly = 3; double lw = 4; double lh = 5;
  int32 nx = 6; int32 ny = 7; int32 nw = 8; int32 nh = 9;
  uint32 rotation = 10; double scale = 11; bool primary = 12;
  // The OS device name this display answers at (`\\.\DISPLAY1` on Windows), "" when the
  // backend has none. Windows renumbers that name when monitors change, so `id` is the
  // stable device-interface id and this field is the alias core maps an older layout through.
  string name = 13;
}
message LocalInputDetected { bytes lease_id = 1; }

// `repeat_guard_ms` (150 ms) passed with no `InputBatch` and no `LeaseRenew`: the receiver
// must stop repeating now (AC-14, `docs/03-architecture.md` «Autorepeat при обрыве связи»).
// Software repeat stops its engine; native repeat lets the held keys up, which is the only
// way to stop an OS/app repeat. The lease itself is not over — a late `LeaseRenew` may
// follow.
message StopRepeat { bytes lease_id = 1; }
enum SessionEventKind {
  SESSION_EVENT_UNSPECIFIED = 0;
  SESSION_EVENT_SUSPEND = 1;
  SESSION_EVENT_RESUME = 2;
  SESSION_EVENT_LOCK = 3;
  SESSION_EVENT_UNLOCK = 4;
}
message SessionEvent { SessionEventKind kind = 1; }
message Pong { uint64 nonce = 1; }
message PortalPermissionRequired { string portal_interface = 1; string purpose = 2; } // purpose: capture | inject | clipboard | hotkey
message PortalPermissionRestoring { string portal_interface = 1; string purpose = 2; } // a persisted grant is being restored
message PortalGrantChanged { PortalGrant grant = 1; bool revoked = 2; }
// code: PORTAL_DENIED, PORTAL_UNAVAILABLE, PORTAL_SESSION_LOST, PORTAL_FRONTEND_STUCK, QUEUE_OVERFLOW, ...
message AgentError { string code = 1; string detail = 2; } // never contains key/clipboard payload

// ---------- clipboard over local IPC ----------
// ADR-008 keeps clipboard content off the input path; between core and the agent it still has to
// travel, and an AgentFrame is at most 64 KiB, so both directions carry the payload in chunks of
// <= 32768 bytes (a 1 MiB payload is 32 chunks). The agent owns the OS selection and never opens
// a socket; core owns the network and never touches the selection. Neither message is logged, and
// neither carries an `offer_id`: the origin/version pair (ADR-008's echo suppression) is enough
// because the two ends of the IPC channel are one node.
message ClipboardChanged {
  uint64 origin_version = 1;   // the agent's monotonic counter of its own clipboard changes
  uint32 chunk_index = 2;      // zero-based
  uint32 chunk_count = 3;      // 1..=64; a payload that fits one frame has count 1, and 64
                               // frames of 32 KiB reach 2 MiB — more than the 1 MiB the policy
                               // refuses, so a copy over the limit is still *reported* and
                               // refused by core's policy rather than dropped by the agent
  bytes data = 4;              // UTF-8 text, <= 32768 bytes
  uint64 size_bytes = 5;       // the whole payload's size, repeated on every chunk
  repeated string markers = 6; // secret markers the platform reported: exclude_from_monitor |
                               // no_history | viewer_ignore | kde_secret | portal_secret
  bytes sha256 = 7;            // of the whole payload; present on the last chunk only
}
message ClipboardApplied { uint64 origin_version = 1; bytes sha256 = 2; bool ok = 3; string detail = 4; }
message SetClipboardText {
  uint64 origin_version = 1;   // node-local apply sequence; core maps it back to the peer's wire version
  uint32 chunk_index = 2;      // zero-based
  uint32 chunk_count = 3;      // 1..=64; 0 releases the selection and forgets the text
  bytes data = 4;              // UTF-8 text, <= 32768 bytes
  bytes sha256 = 5;            // of the whole payload; present on the last chunk only
}

// ---------- gui <-> core ----------
message GuiFrame {
  uint64 seq = 1;
  uint64 request_id = 2; // correlates request/response; 0 for events
  reserved 11; reserved "set_role"; // roles are per-lease in v0.3; the GUI no longer sets a role
  oneof msg {
    GetStatus get_status = 10;
    StartPairing start_pairing = 12;
    PairWith pair_with = 13;
    PairingAnswer pairing_answer = 14;
    UpdateTopology update_topology = 15; // any node; the edit is forwarded to the coordinator
    SetClipboard set_clipboard = 16;
    SetAppearance set_appearance = 30;
    RevokePeer revoke_peer = 17;
    ExportDiagnostics export_diagnostics = 18;
    ResetPortalGrants reset_portal_grants = 19; // forget restore tokens, re-ask the portal
    ClaimOwnership claim_ownership = 20;  // make this node the owner (GUI button)
    AbandonOwnership abandon_ownership = 21; // give up ownership, stay a follower
    GetTopology get_topology = 22;        // read the applied layout document (editor model)
    ListPendingEdits list_pending_edits = 23; // divergent edits kept after a partition
    ApplyPendingEdit apply_pending_edit = 24;
    DiscardPendingEdit discard_pending_edit = 25;
    RetryAgent retry_agent = 26;
    Shutdown shutdown = 27;               // ask this core to shut down cleanly
    LayoutAuto layout_auto = 28;           // «Расположить автоматически»: rebuild the layout from this desktop
    SwitchTo switch_to = 29;               // «Передать ввод»: the destination, not a toggle — an empty peer means Local
    SetHotkey set_hotkey = 31;
    GetClipboardHistory get_clipboard_history = 32;
    GetClipboardHistoryItem get_clipboard_history_item = 33;
    ClearClipboardHistory clear_clipboard_history = 34;
    SetDiscovery set_discovery = 35; // persist `[discovery].enabled` in the core; reply with OpResult
    UpdateAll update_all = 36;
    SetRemoteUpdate set_remote_update = 37;
    UpdateProgress update_progress = 38; // headless updater -> core
    UpdateReady update_ready = 39;       // verified replacement ready for core shutdown
    SetGameGuard set_game_guard = 49;

    Status status = 40;          // response and pushed event
    PairingPrompt pairing_prompt = 41;
    OpResult op_result = 42;
    TopologyDoc topology_doc = 43;   // response to GetTopology and pushed on every applied revision
    PendingEdits pending_edits = 44; // response to ListPendingEdits
    PairingWindow pairing_window = 45; // pushed when the pairing window opens, changes or closes
    HotkeysResult hotkeys_result = 46;
    ClipboardHistory clipboard_history = 47;
    ClipboardHistoryItem clipboard_history_item = 48;
    SendClipboardHistoryItem send_clipboard_history_item = 50;
    SetClipboardPolicy set_clipboard_policy = 51;
    RequestPairing request_pairing = 52;
    AnswerPairingRequest answer_pairing_request = 53;
    CancelPairingRequest cancel_pairing_request = 54;
    SetPairingRequests set_pairing_requests = 55;
    IncomingPairingRequest incoming_pairing_request = 56;
    OutgoingPairingRequest outgoing_pairing_request = 57;
    MutePairingRequester mute_pairing_requester = 58;
    PairingResult pairing_result = 59; // explicit ceremony outcome; OpResult only acknowledges a request
  }
}
// Also replays the current open PairingWindow and unanswered PairingPrompt as events
// on this connection, so a second/reconnecting GUI sees an existing ceremony.
message GetStatus {}
message LayoutAuto {} // the core runs the same layout_auto the `layout auto` command does
message SwitchTo { string peer = 1; } // a node id (hex) or a display name; empty means Local ("передать ввод домой")
message ClaimOwnership {}
message AbandonOwnership {}
message StartPairing { uint32 window_s = 1; } // max 120
message PairWith { string address = 1; }
message PairingAnswer { bytes attempt_id = 1; bool approve = 2; }
message RequestPairing { string address = 1; string node_id = 2; string display_name = 3; bool supports_requests = 4; }
message AnswerPairingRequest { bytes requester_node_id = 1; bool accept = 2; }
message CancelPairingRequest {}
message SetPairingRequests { bool enabled = 1; }
message MutePairingRequester { string node_id = 1; } // locally hidden discovery identity; muted for 10 min
message IncomingPairingRequest {
  bytes requester_node_id = 1;
  string display_name = 2;
  string system_name = 3;
  string fingerprint = 4;
  uint32 seconds_remaining = 5;
}
message OutgoingPairingRequest {
  string node_id = 1;
  string display_name = 2;
  string state = 3; // waiting | accepted | declined | timeout | cancelled | busy | disabled | legacy | error
}
message UpdateTopology { bytes layout_toml = 1; uint64 expected_revision = 2; bytes expected_author = 3; } // any node; coordinator applies (CAS)
message SetClipboard { bool enabled = 1; }
message SetClipboardPolicy { string policy = 1; uint32 settle_ms = 2; }
message SetAppearance { bool edge_effects = 1; bool hide_remote_cursor = 2; } // core saves `[appearance]` under the config lock and pushes SetEffects to the agent at once
message SetDiscovery { bool enabled = 1; } // core saves under the config lock and updates live discovery
message RevokePeer { bytes peer_node_id = 1; }
message ExportDiagnostics { string target_path = 1; }
message ResetPortalGrants {} // GUI: drop portal permissions for this node
message RetryAgent {}
message Shutdown {}
message UpdateAll { string target_version = 1; }
message SetRemoteUpdate { bool enabled = 1; }
message UpdateProgress { string target_version = 1; string status = 2; string detail = 3; }
message UpdateReady { string target_version = 1; }
message NodeUpdate {
  string node_id = 1;
  string display_name = 2;
  string target_version = 3;
  string status = 4; // pending | downloading | restarting | done | refused | unreachable
  string detail = 5;
}

enum HotkeyAction {
  HOTKEY_ACTION_UNSPECIFIED = 0;
  HOTKEY_ACTION_EMERGENCY_RELEASE = 1;
  HOTKEY_ACTION_SWITCH_NEXT = 2;
  HOTKEY_ACTION_RETURN_LOCAL = 3;
  HOTKEY_ACTION_CLAIM_OWNERSHIP = 4;
  HOTKEY_ACTION_GAME_GUARD_TOGGLE = 5;
}
message HotkeyBinding {
  HotkeyAction action = 1;
  string chord = 2;
  bool available = 3;
  string detail = 4;
}
message SetHotkey { HotkeyAction action = 1; string chord = 2; }
message SetHotkeys { repeated HotkeyBinding bindings = 1; }
message HotkeysResult {
  bool success = 1;
  string detail = 2;
  repeated HotkeyBinding bindings = 3;
}
message HotkeyPressed { HotkeyAction action = 1; }
message Status {
  string role = 1;           // "owner" | "follower" (per-lease source/receiver is derived from focus)
  string focus = 2;          // LOCAL / PREPARING / REMOTE / BLOCKED
  string active_peer = 3;    // display name
  bool connected = 4;
  bool clipboard_enabled = 5;
  string emergency_hotkey = 6;
  uint32 rtt_p95_us = 7;
  uint32 rtt_jitter_us = 8;
  string last_error_code = 9;
  string backend = 10;                     // "platform-win" | "platform-x11" | "platform-wayland"
  repeated string capabilities_unavailable = 11; // e.g. EMERGENCY_HOTKEY, RECEIVER_TAKEOVER
  string portal_state = 12;                // "" | "permission_required" | "denied" | "unavailable"
  bool is_owner = 13;
  string owner_node_id = 14;               // hex or short form; empty when none known
  uint64 owner_serial = 15;
  repeated MemberStatus members = 16;
  uint64 layout_revision = 17;
  string layout_author = 18;
  uint32 layout_pending_edits = 19;        // divergent local edits kept after a partition
  bool layout_editable = 20;               // false when no coordinator is reachable
  string active_layout = 21;               // receiver's active keyboard layout while focus is REMOTE ("" otherwise); e.g. "ru"
  string agent_degraded_reason = 22;        // last typed agent/portal failure or restart breaker reason
  bool agent_restart_circuit_open = 23;     // automatic restarts stopped; manual retry is available
  string transition_disabled_reason = 24;  // complete user-facing sentence; "" when transitions are available
  bool edge_effects = 25;                  // `[appearance].edge_effects`: the ASCII strip at linked edges
  bool hide_remote_cursor = 26;            // `[appearance].hide_remote_cursor`: hide the cursor here while input is elsewhere
  repeated HotkeyBinding hotkeys = 27;
  string local_node_id = 28;               // this node's own id, hex; empty when the core cannot say
  repeated DiscoveredPeer discovered_peers = 29; // untrusted LAN hints; GUI hides ids already in members
  bool discovery_enabled = 30;             // persisted `[discovery].enabled`, not a GUI-local preference
  bool allow_remote_update = 31;
  repeated NodeUpdate update_nodes = 32;
  string update_notice = 33;
  GameGuardSignals game_guard_signals = 34;
  string game_guard_reason = 35;
  string game_guard_mode = 36;
  repeated string game_guard_block_apps = 37;
  repeated string game_guard_allow_apps = 38;
  string game_guard_last_app = 39; // last non-Bifrost foreground app, for Settings after focusing GUI
  string clipboard_policy = 40;
  uint32 clipboard_settle_ms = 41;
  repeated PendingUnpairNotice pending_unpairs = 42;
  string unpair_notice = 43; // display name of the peer that removed this pairing
  uint64 unpair_notice_id = 44; // monotonically increasing; 0 means no notice
  bool accept_pairing_requests = 45;
  string active_peer_node_id = 46; // authoritative input target, hex NodeId; empty when local/unknown
}
message PendingUnpairNotice {
  string node_id = 1;
  uint64 created_unix_secs = 2;
}
// Discovery is not pairing or authentication. Address is the observed IPv4 source
// plus the advertised input/control port ("<ip>:<port>"), never a beacon-supplied IP.
message DiscoveredPeer {
  string node_id = 1;          // 64 hexadecimal digits; an untrusted identity claim
  string display_name = 2;     // sanitized, at most 32 characters
  string address = 3;
  string system_name = 4;      // optional machine label; empty when unavailable
  bool pairing_open = 5;
  uint32 protocol_version = 6;
  bool supports_pairing_requests = 7;
}
message MemberStatus {
  string node_id = 1;
  string display_name = 2;
  bool online = 3;
  bool is_owner = 4;
  string link_state = 5;   // OFFLINE / CONNECTING / TLS / HELLO / READY / CLOSING
  string app_version = 6;
  bool remote_update = 7;
  bool pairing_maybe_removed = 8; // offline peer may have removed this pairing
}

// Source-local observations only; never sent over the network.
message GameGuardSignals {
  bool available = 1;
  bool fullscreen = 2;
  bool cursor_confined = 3;
  bool presentation = 4;
  string app = 5;
}
message SetGameGuard {
  string mode = 1; // auto | always | off
  repeated string block_apps = 2;
  repeated string allow_apps = 3;
}
message PairingPrompt { bytes attempt_id = 1; string peer_name = 2; string sas_code = 3; string local_fingerprint = 4; string peer_fingerprint = 5; }
// Pushed when the pairing window opens or closes, and replayed on GetStatus.
// The GUI counts down locally from seconds_remaining. The window is served on the node's
// input/control port by ALPN
// `lan-workspace/pair/1` (docs/05-protocol.md, «Сопряжение»), so a `StartPairing`
// answer alone would leave the GUI unable to tell its user what the other computer
// has to type: `address` is exactly that.
message PairingWindow {
  bool open = 1;
  string address = 2;           // "<ip>:<port>" the other node dials; "" when closed
  uint32 seconds_remaining = 3; // until the 120 s window closes; 0 when closed
  bytes attempt_id = 4;         // the id every PairingAnswer of this window names; empty when closed
}
message OpResult { bool ok = 1; string error_code = 2; }
enum PairingOutcome {
  PAIRING_OUTCOME_UNSPECIFIED = 0;
  PAIRING_OUTCOME_PAIRED = 1;
  PAIRING_OUTCOME_REJECTED = 2;
  PAIRING_OUTCOME_FAILED = 3;
}
message PairingResult { PairingOutcome outcome = 1; string peer_name = 2; }

// ---------- layout editor model (gui <-> core) ----------
// TopologyDoc is the applied layout document plus the display geometry of every
// member; it is the model the GUI edits. It answers GetTopology and is pushed on
// every applied revision. The GUI serializes its edited model back into
// UpdateTopology.layout_toml (same schema as config.example.toml [topology]).
message GetTopology {}
message TopologyDoc {
  uint64 revision = 1;
  string author_node_id = 2;         // author of the applied revision
  repeated MemberTopology members = 3;
  repeated LinkView links = 4;
  repeated string forgotten_node_ids = 5; // retain layout exclusions when editing the map
}
message MemberTopology {
  string node_id = 1;
  string display_name = 2;
  bool online = 3;                   // advisory, as NodeDisplays.online
  repeated DisplayView displays = 4;
  string system_name = 5;                  // last known OS name/version, optional
  string app_version = 6;
}
message DisplayView {
  string id = 1;                     // stable display id
  double logical_x = 2; double logical_y = 3; double logical_w = 4; double logical_h = 5;
  uint32 rotation_degrees = 6;       // 0, 90, 180, 270
  bool primary = 7;
  bool native_known = 8;             // false on Wayland portals
  double scale = 9;                  // native/logical when known; GUI only
  uint32 native_width = 10;                // current mode pixels; zero means unknown
  uint32 native_height = 11;
}
message LinkView {
  string id = 1;
  EndpointView from = 2;
  EndpointView to = 3;
  bool bidirectional = 4;
  // false while an endpoint display is not in the live manifests (a monitor that is off,
  // asleep or renumbered). The link is kept in the document and becomes active again on the
  // next report; the resolver simply does not use it yet.
  bool active = 5;
  // The missing display id when `active` is false; "" otherwise. GUI text only.
  string inactive_reason = 6;
  // The displays a desktop-anchored endpoint (`display = "auto"`, shown as «Весь рабочий стол
  // (авто)») resolves to against the live manifests right now, in document order. Empty for a
  // link that names its displays. GUI text only.
  repeated string auto_displays = 7;
}
message EndpointView {
  string node_id = 1;
  string display_id = 2;
  string edge = 3;                   // LEFT | RIGHT | TOP | BOTTOM
  double segment_start = 4;          // distance along the edge from its start
  double segment_end = 5;
}

// Divergent local edits kept after a partition (layout.pending.toml). Apply asks
// the coordinator to re-apply one as a new CAS revision; Discard drops it.
message ListPendingEdits {}
message PendingEdit {
  bytes edit_id = 1;                 // random16
  uint64 base_revision = 2;          // (base_revision, base_author) the edit was based on
  string base_author = 3;
  string author_node_id = 4;         // who edited in the GUI
  bytes layout_toml = 5;             // full document of the divergent edit
}
message PendingEdits { repeated PendingEdit edits = 1; }
message ApplyPendingEdit { bytes edit_id = 1; }
message DiscardPendingEdit { bytes edit_id = 1; }

// Session-only history: at most 30 transferred text items, never secret-marked or persisted.
message GetClipboardHistory {}
// copy_to_local applies locally and returns OpResult; otherwise returns chunked full text.
message GetClipboardHistoryItem { uint64 id = 1; bool copy_to_local = 2; }
// Returns OpResult; the GUI requests fresh history afterward.
message ClearClipboardHistory {}
// Sends directly to an online trusted remote member; returns OpResult, never queues.
message SendClipboardHistoryItem { uint64 id = 1; bytes peer_node_id = 2; }
enum ClipboardHistoryDirection {
  CLIPBOARD_HISTORY_DIRECTION_UNSPECIFIED = 0;
  CLIPBOARD_HISTORY_DIRECTION_SENT = 1;
  CLIPBOARD_HISTORY_DIRECTION_RECEIVED = 2;
  CLIPBOARD_HISTORY_DIRECTION_COPIED = 3; // local copy retained for routing, not yet sent
}
message ClipboardHistoryEntry {
  uint64 id = 1;
  ClipboardHistoryDirection direction = 2;
  string peer_name = 3;
  uint64 time_unix_ms = 4;
  uint64 size_bytes = 5;
  string preview = 6; // first 120 Unicode scalar values
}
message ClipboardHistory { repeated ClipboardHistoryEntry items = 1; } // newest first
message ClipboardHistoryItem {
  uint64 id = 1;
  string text = 2;
  uint32 chunk_index = 3; // zero-based; UTF-8 boundaries are preserved
  uint32 chunk_count = 4;
}
