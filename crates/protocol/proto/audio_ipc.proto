syntax = "proto3";
package bifrost.audio_worker.v1;

// Private same-user core/child channel, never network media or GUI IPC.
// StartSession grants bounded authorization, not Prepare: core sends it only after
// consent and parent binding. Native-init acknowledgment may precede peer commit.
// Ping is liveness only, never permission.
message AudioFrame {
  uint32 major = 1;
  uint32 minor = 2;
  uint64 seq = 3;
  uint64 worker_generation = 4;
  uint64 request_id = 5;
  oneof msg {
    Attach attach = 10;
    ListDevices list_devices = 11;
    StartSession start_session = 12;
    StopSession stop_session = 13;
    SetGain set_gain = 14;
    Ping ping = 15;
    Shutdown shutdown = 16;
    ProbeBackend probe_backend = 17;
    RenewSession renew_session = 70;
    AcquireMicMute acquire_mic_mute = 18;
    SetMicMute set_mic_mute = 19;
    ReleaseMicMute release_mic_mute = 20;
    ConfigurePtt configure_ptt = 21;
    PttGrant ptt_grant = 22;
    PttRevoke ptt_revoke = 23;
    SetMediaWatch set_media_watch = 30;
    MediaCommand media_command = 31;
    Ready ready = 40;
    Devices devices = 41;
    Pong pong = 42;
    SessionEvent session_event = 43;
    Health health = 44;
    BackendEvent backend_event = 45;
    Error error = 46;
    MuteSnapshot mute_snapshot = 47;
    PttEvent ptt_event = 48;
    MediaSessions media_sessions = 60;
    MediaCommandResult media_command_result = 61;
  }
  reserved 24 to 29, 32 to 39, 49 to 59, 62 to 69;
}

enum BackendKind { BACKEND_KIND_UNSPECIFIED = 0; BACKEND_KIND_NATIVE = 1; BACKEND_KIND_DRY = 2; BACKEND_KIND_LINUX_PULSE = 3; BACKEND_KIND_WINDOWS_WASAPI = 4; }
enum Role { ROLE_UNSPECIFIED = 0; ROLE_SOURCE = 1; ROLE_LISTENER = 2; }
enum Profile { PROFILE_UNSPECIFIED = 0; PROFILE_ETHERNET = 1; PROFILE_WIFI = 2; }
enum Direction { DIRECTION_UNSPECIFIED = 0; DIRECTION_RENDER = 1; DIRECTION_CAPTURE = 2; }
enum DefaultRole { DEFAULT_ROLE_UNSPECIFIED = 0; DEFAULT_ROLE_MULTIMEDIA = 1; DEFAULT_ROLE_COMMUNICATIONS = 2; }
enum CaptureKind { CAPTURE_KIND_UNSPECIFIED = 0; CAPTURE_KIND_SYSTEM_EXCLUDING_OWN_PROCESS_TREE = 1; CAPTURE_KIND_MONITOR = 2; CAPTURE_KIND_ENDPOINT_LOOPBACK = 3; reserved 4; /* M5 microphone capture. */ }
enum Capability { CAPABILITY_UNSPECIFIED = 0; CAPABILITY_SYSTEM_CAPTURE = 1; CAPABILITY_RENDER = 2; CAPABILITY_PROCESS_EXCLUSION = 3; CAPABILITY_ENDPOINT_MUTE = 4; CAPABILITY_GLOBAL_PTT = 5; CAPABILITY_MEDIA_SESSIONS = 6; }
enum Availability { AVAILABILITY_UNSPECIFIED = 0; AVAILABILITY_AVAILABLE = 1; AVAILABILITY_UNSUPPORTED = 2; AVAILABILITY_UNAVAILABLE = 3; }
enum UnavailableReason { UNAVAILABLE_REASON_UNSPECIFIED = 0; UNAVAILABLE_REASON_NOT_PROBED = 1; UNAVAILABLE_REASON_NOT_SUPPORTED = 2; UNAVAILABLE_REASON_SERVER_UNAVAILABLE = 3; UNAVAILABLE_REASON_PERMISSION_DENIED = 4; UNAVAILABLE_REASON_DEVICE_GONE = 5; UNAVAILABLE_REASON_PROCESS_EXCLUSION_UNAVAILABLE = 6; UNAVAILABLE_REASON_ENDPOINT_MUTE_OWNERSHIP_UNAVAILABLE = 7; UNAVAILABLE_REASON_DEFERRED_M5 = 8; UNAVAILABLE_REASON_DEFERRED_M6 = 9; UNAVAILABLE_REASON_BACKEND_FAILURE = 10; }
enum EventKind { EVENT_KIND_UNSPECIFIED = 0; EVENT_KIND_STARTED = 1; EVENT_KIND_DEGRADED = 2; EVENT_KIND_DEVICE_INVALIDATED = 3; EVENT_KIND_ROTATION_REQUIRED = 4; EVENT_KIND_STOPPED = 5; EVENT_KIND_PATH_VALIDATED = 6; }
enum StopReason { STOP_REASON_UNSPECIFIED = 0; STOP_REASON_USER = 1; STOP_REASON_DEVICE_INVALIDATED = 2; STOP_REASON_NETWORK_FAILURE = 3; STOP_REASON_WORKER_FAILED = 4; STOP_REASON_PATH_TIMEOUT = 5; STOP_REASON_ROTATION_REQUIRED = 6; STOP_REASON_CORE_LOST = 7; STOP_REASON_SHUTDOWN = 8; STOP_REASON_AUTHORIZATION_LOST = 9; }
enum StreamHealth { STREAM_HEALTH_UNSPECIFIED = 0; STREAM_HEALTH_READY = 1; STREAM_HEALTH_BUFFERING = 2; STREAM_HEALTH_DEGRADED = 3; }
enum BackendEventKind { BACKEND_EVENT_KIND_UNSPECIFIED = 0; BACKEND_EVENT_KIND_ADDED = 1; BACKEND_EVENT_KIND_REMOVED = 2; BACKEND_EVENT_KIND_DEFAULT_CHANGED = 3; BACKEND_EVENT_KIND_FORMAT_CHANGED = 4; BACKEND_EVENT_KIND_INVALIDATED = 5; BACKEND_EVENT_KIND_RESYNC_REQUIRED = 6; }
enum ErrorCode { ERROR_CODE_UNSPECIFIED = 0; ERROR_CODE_UNSUPPORTED = 1; ERROR_CODE_DEVICE_UNAVAILABLE = 2; ERROR_CODE_RESOURCE_LIMIT = 3; ERROR_CODE_SESSION_REUSED = 4; ERROR_CODE_KEY_REUSED = 5; ERROR_CODE_INVALID_STATE = 6; ERROR_CODE_BIND_FAILED = 7; ERROR_CODE_BACKEND_FAILED = 8; ERROR_CODE_RESTART_REQUIRED = 9; }

// First frame only, token delivered separately via the private one-use launch file.
// Ready first reports probed=false/NotProbed without opening any backend. Core
// explicitly requests ProbeBackend before relying on availability observations.
message Attach { bytes launch_token = 1; BackendKind backend = 2; uint32 core_silence_ms = 3; }
message ProbeBackend {}
message CapabilityAvailability { Capability capability = 1; Availability availability = 2; UnavailableReason reason = 3; }
message Ready { BackendKind backend = 1; bool probed = 2; repeated CapabilityAvailability capabilities = 3; }
message Ping { uint64 serial = 1; }
message Pong { uint64 serial = 1; }
message Shutdown {}

message DeviceSelection {
  oneof selector { string device_id = 1; DefaultRole follow_default = 2; }
}
message CaptureSpec { CaptureKind kind = 1; DeviceSelection device = 2; }
message DirectionMaterial { bytes key = 1; bytes nonce_prefix = 2; }
message StartSession {
  bytes session_id = 1;
  Role role = 2;
  Profile profile = 3;
  CaptureSpec capture = 4; // Source only.
  DeviceSelection render = 5; // Listener only.
  string local_bind_ip = 6; // Numeric, unicast, selected-interface IP; never DNS/wildcard.
  uint32 local_udp_port = 7; // 0 selects default 47903; otherwise 1..65535 except 47902.
  string peer_ip = 8; // Core verifies this is the authenticated parent's peer IP.
  uint32 peer_udp_port = 9;
  DirectionMaterial forward = 10; // Source->Listener; never TLS dialer direction.
  DirectionMaterial reverse = 11;
  uint32 local_scope_id = 12; // IPv6 interface scope, zero for IPv4.
  uint32 peer_scope_id = 13;
  uint32 initial_authorization_ms = 14; // Required, 1..1000; zero never grants permission.
}
message StopSession { bytes session_id = 1; }
message RenewSession { bytes session_id = 1; uint32 ttl_ms = 2; } // Exact 16-byte ID, TTL 1..1000; cannot revive a stopped session.
message SetGain { bytes session_id = 1; uint32 gain_percent = 2; bool muted = 3; } // Listener-local 0..100.

// At most 16 devices/page and 64/device direction inventory. Page zero has
// inventory_revision=0; later pages echo the Devices revision and request_id.
message ListDevices { Direction direction = 1; uint32 page = 2; uint64 inventory_revision = 3; }
message Device { string id = 1; string name = 2; Direction direction = 3; uint32 sample_rate = 4; uint32 channels = 5; bool is_default = 6; }
message Devices { Direction direction = 1; uint32 page = 2; uint64 inventory_revision = 3; repeated Device devices = 4; bool complete = 5; }
// Started acknowledges successful socket registration and native device/session
// initialization, before a peer or validated media path is required. It carries
// the bound local_udp_port (>0), reason=Unspecified, and does not imply PathValidated.
// PathValidated separately reports media-path success, with reason=Unspecified.
// Only Started carries a port; every other event requires local_udp_port=0.
// Path failure is Stopped with reason=PathTimeout; Stopped requires a known,
// nonzero reason. Every other event requires reason=Unspecified.
message SessionEvent { bytes session_id = 1; EventKind kind = 2; StopReason reason = 3; uint32 local_udp_port = 4; PathDiagnostic path_diagnostic = 5; }
// Observations at PathTimeout, not assertions about which firewall blocked traffic.
enum PathDiagnostic {
  PATH_DIAGNOSTIC_NONE = 0;
  PATH_DIAGNOSTIC_NO_AUTHENTICATED_PEER_PACKETS = 1;
  PATH_DIAGNOSTIC_PEER_PROBES_MISSING = 2;
  PATH_DIAGNOSTIC_PROBE_RESPONSES_MISSING = 3;
  PATH_DIAGNOSTIC_AUTHENTICATION_FAILURES = 4;
}
message PathHealth {
  PathDiagnostic diagnostic = 1; // None while pending or validated.
  bool validated = 2;
  uint32 probes_sent = 3; // <=3.
  uint32 peer_probes = 4; // Saturating authenticated observations.
  uint64 auth_failures = 5;
}
message AudioHealth { uint64 received_packets = 1; uint64 lost_frames = 2; uint64 late_frames = 3; uint64 concealed_frames = 4; uint64 underruns = 5; uint64 discontinuities = 6; uint64 limiter_frames = 7; }
message DriftDiagnostics {
  sint32 ratio_ppm = 1;
  double filtered_fill_error_frames = 2;
  uint64 coarse_corrections = 3;
}
enum ClockSource {
  CLOCK_SOURCE_UNKNOWN = 0;
  CLOCK_SOURCE_CAPTURE_HOST_TIMESTAMP = 1;
  CLOCK_SOURCE_CAPTURE_CALLBACK_FRAMES = 2;
  CLOCK_SOURCE_RENDER_DEVICE_POSITION = 3;
  CLOCK_SOURCE_RENDER_CALLBACK_FRAMES = 4;
}
message SessionHealth {
  bytes session_id = 1;
  AudioHealth counters = 2;
  StreamHealth state = 3;
  optional bool capture_active = 4; // Actual capture callback observations, not lifecycle inference.
  optional bool sending = 5; // Actual recent outgoing Opus, not probes/keepalives/reports.
  uint64 sent_media_packets = 6;
  DriftDiagnostics drift = 7; // Absent for Source: no receiver PI controller.
  ClockSource clock_source = 8;
  LatencyDiagnostics latency = 9;
  uint64 native_discontinuity_flags = 10; // Native flags only; AudioHealth.discontinuities counts actual gap fill/reanchor.
  uint64 jitter_rebuffers = 11; // Rebuffer episodes, not concealed/missing frames.
  uint64 render_underruns = 12; // Native callbacks requiring zero-fill.
  PathHealth path = 13;
  RemoteReceiverQuality remote_receiver_quality = 14; // Source only; never local playout state.
}
message RemoteReceiverQuality { uint64 received_packets = 1; uint64 lost_frames = 2; uint64 late_frames = 3; }
message Health { repeated SessionHealth sessions = 1; } // <=3, coalesced, at most ~1 Hz.
message BackendEvent { BackendEventKind kind = 1; string device_id = 2; Direction direction = 3; DefaultRole default_role = 4; }
message Error { ErrorCode code = 1; bytes session_id = 2; } // Fixed codes only; no keys, paths or device text.

// Endpoint generation compares prevent writes against a replacement device.
message AcquireMicMute { DeviceSelection selection = 1; }
message SetMicMute { uint64 expected_generation = 1; bool muted = 2; }
message ReleaseMicMute {}
message MuteSnapshot { string endpoint_id = 1; uint64 generation = 2; bool muted = 3; bool guard_active = 4; }
message PttHotkey { uint32 key_code = 1; bool control = 2; bool alt = 3; bool shift = 4; bool meta = 5; }
message ConfigurePtt { optional PttHotkey binding = 1; repeated PttHotkey reserved = 2; } // <=16, unique, no binding collision.
// Explicit toggles are persistent. Remote talk grants alone are lease-bounded.
message PttGrant { uint64 grant_id = 1; uint32 ttl_ms = 2; } // Nonzero ID, TTL 1..250ms; Ping never renews.
message PttRevoke { uint64 grant_id = 1; } // Stale IDs never revoke a newer grant.
enum PttEventKind { PTT_EVENT_KIND_UNSPECIFIED = 0; PTT_EVENT_KIND_PRESSED = 1; PTT_EVENT_KIND_RENEWED = 2; PTT_EVENT_KIND_RELEASED = 3; PTT_EVENT_KIND_REFUSED = 4; PTT_EVENT_KIND_NOOP = 5; }
enum PttReleaseReason { PTT_RELEASE_REASON_UNSPECIFIED = 0; PTT_RELEASE_REASON_EXPIRED = 1; PTT_RELEASE_REASON_REVOKED = 2; PTT_RELEASE_REASON_REPLACED = 3; PTT_RELEASE_REASON_EXPLICIT_MUTE = 4; PTT_RELEASE_REASON_PRE_MUTED = 5; PTT_RELEASE_REASON_PERSISTENT_UNMUTE = 6; PTT_RELEASE_REASON_BACKEND_FAILED = 7; }
// Physical observations use grant_id=0/reason=0. Talk grants use a nonzero ID.
// Pressed: expires>observed, delta<=250ms. Renewed: observed=0, expires>0.
// Released/Refused/Noop: timestamps zero. A positive outer ID correlates admission/result.
message PttEvent { PttEventKind kind = 1; uint64 observed_at_ns = 2; uint64 expires_at_ns = 3; uint64 grant_id = 4; PttReleaseReason reason = 5; }
message SetMediaWatch { bool enabled = 1; } // Success is an asynchronous MediaSessions snapshot.
enum MediaCommandKind { MEDIA_COMMAND_KIND_UNSPECIFIED = 0; MEDIA_COMMAND_KIND_PLAY = 1; MEDIA_COMMAND_KIND_PAUSE = 2; MEDIA_COMMAND_KIND_TOGGLE = 3; MEDIA_COMMAND_KIND_NEXT = 4; MEDIA_COMMAND_KIND_PREVIOUS = 5; }
message MediaCommand { uint64 token = 1; uint64 expected_revision = 2; MediaCommandKind command = 3; }
enum PlaybackState { PLAYBACK_STATE_UNKNOWN = 0; PLAYBACK_STATE_PLAYING = 1; PLAYBACK_STATE_PAUSED = 2; PLAYBACK_STATE_STOPPED = 3; }
message MediaInfo {
  uint64 token = 1;
  uint64 revision = 2;
  string app_id = 3; // <=128 UTF-8 bytes.
  string title = 4; // <=256 UTF-8 bytes; never Debug/log.
  string subtitle = 5; // <=256 UTF-8 bytes; never Debug/log.
  optional uint64 position_ms = 6;
  optional uint64 duration_ms = 7;
  PlaybackState state = 8;
  uint32 commands = 9; // Play/Pause/Toggle/Next/Previous bits 0..4.
}
message MediaSessions { repeated MediaInfo sessions = 1; optional uint64 current_token = 2; uint64 revision = 3; } // <=32 unique nonzero tokens, push only.
enum MediaCommandStatus { MEDIA_COMMAND_STATUS_UNSPECIFIED = 0; MEDIA_COMMAND_STATUS_OK = 1; MEDIA_COMMAND_STATUS_STALE_REVISION = 2; MEDIA_COMMAND_STATUS_UNSUPPORTED = 3; MEDIA_COMMAND_STATUS_TIMEOUT = 4; MEDIA_COMMAND_STATUS_CANCELLED = 5; }
message MediaCommandResult { MediaCommandStatus result = 1; } // Correlates through AudioFrame.request_id.

// Per-stage microseconds, each <=2,000,000. Jitter target and occupancy overlap.
// Native output depth absent without a valid device/QPC snapshot; not assumed zero.
message LatencyDiagnostics {
  uint32 packetization_us = 1;
  uint32 capture_queue_us = 2;
  uint32 codec_lookahead_us = 3;
  uint32 jitter_target_us = 4;
  uint32 jitter_buffer_us = 5;
  uint32 decoded_queue_us = 6;
  uint32 render_queue_us = 7;
  uint32 resampler_delay_us = 8;
  optional uint32 native_render_buffer_us = 9;
}
