[package]
name = "platform-audio-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bifrost: local Pulse protocol audio backend"

[lints]
workspace = true

[features]
testing = []

[target.'cfg(target_os = "linux")'.dependencies]
audio-backend = { path = "../audio-backend" }
pulseaudio = "=0.3.2"
futures = "0.3"
futures-timer = "3"
zeroize = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
rustix = { version = "1", features = ["time", "fs"] }
toml = "1"
libloading = "=0.8.9"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
audio-media = { path = "../audio-media" }
audio-model = { path = "../audio-model" }
rtrb = "0.3"
