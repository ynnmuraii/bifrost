[package]
name = "identity"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LAN Workspace: node identity, pinned mTLS, SAS pairing, trust store (KVM-030)"

[lints]
workspace = true

[dependencies]
geometry = { path = "../geometry" }
protocol = { path = "../protocol" }
# `config::paths` owns the documented application directory and file names, so this crate
# imports them instead of repeating the literals. The edge is one-way and light: `config`
# pulls only geometry, protocol, serde and toml, all already in this crate's graph.
config = { path = "../config" }

# TLS 1.3 only, `ring` backend: no cmake/nasm, so the Windows and Linux builds need no
# extra toolchain (the docs leave the algorithm open - see the crate docs for the
# Ed25519 choice).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
x509-cert = "0.3"

serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# Windows key protection (DPAPI CurrentUser) and the owner-only directory/file ACL.
# `windows` is only needed there: on Linux the documented protection is the file mode.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }
