[package]
name = "platform-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows capture (low-level hooks + Raw Input) and SendInput injection spikes for Bifrost (KVM-010/KVM-011)."

[lints]
workspace = true

[dependencies]
clipboard = { path = "../clipboard" }
edgefx = { path = "../edgefx" }
input-model = { path = "../input-model" }

# The Windows bindings are only needed for the real Windows targets; on any other
# target the crate compiles to the platform-neutral part only (tables, ledger,
# injection plan) and pulls in no FFI at all.
[target.'cfg(windows)'.dependencies]
png = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
