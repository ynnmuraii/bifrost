# bifrost — пример config.toml (config_version = 2, см. 03-architecture.md)
# Файл пишется атомарно: tmp + fsync + rename; предыдущая версия -> config.toml.bak

config_version = 2

[node]
display_name = "Workstation"        # не является идентичностью
can_own = true                      # этот узел может становиться владельцем ввода (owner)
claim_on_startup = true             # при старте заявить владение (Windows: true, ноутбуки: false); serial = max_seen + 1

[platform]
backend = "auto"                    # "auto" | "x11" | "wayland"; выбранный вручную обязан совпасть с сеансом
# Wayland: restore token порталов лежит отдельно от этого файла —
# $XDG_STATE_HOME/bifrost/portal-restore.toml (0600, каталог 0700);
# в config.toml и в diagnostic export он не попадает.

[network]
listen_address = "192.168.1.10"     # конкретный LAN-интерфейс, не 0.0.0.0; слушают все узлы
port_input = 47901
port_clipboard = 47902
reconnect_backoff_ms = [500, 5000]
max_members = 3                     # поддержано и тестируется 3 узла; допустимо 1..4 (N_max = 4); пятый отвергается (MEMBERSHIP_FULL)

# Список доверенных пиров; заполняется сопряжением, адрес можно поправить вручную.
# Первичное сопряжение: обнаружение в LAN или ручной ввод IP; mDNS нет.
[[network.peers]]
node_id = "9c1e…"                   # SHA-256(SPKI DER) доверенного узла
address = "192.168.1.11"            # пусто = адрес ещё неизвестен

[discovery]                         # UDP IPv4 multicast 239.255.47.90:47902; не заменяет сопряжение
enabled = true                      # false отключает приём и отправку beacon
advertise = true                    # false оставляет приём, но скрывает этот узел

[pairing]
accept_requests = true              # только запрос разрешения; доверие требует кода на обоих экранах

[workspace]                         # владение вводом и координация layout
owner_claim_serial = 0              # персистится: последний известный serial владения
owner_node_id = ""                  # персистится: последний известный owner
link_ping_ms = 1000                 # Ping по каждому линку в простое
link_timeout_ms = 3000              # нет Pong -> член считается офлайн
claim_grant_timeout_ms = 600        # после этого claim становится self-grant

[timing]                             # пределы проверяются при загрузке
prepare_timeout_ms = 200             # 150..400
lease_ttl_ms = 1000                  # 300..1000; все дедлайны lease выводятся отсюда, challenge = min(ttl / 5, 100 мс)
agent_core_silence_ms = 300          # 200..500; порог тишины core для агента (передаётся в AgentAttach); IPC-heartbeat = это значение / 4
repeat_guard_ms = 150                # нет input/renew дольше — receiver прекращает автоповтор (гарантия по времени: лишние символы ~ rate × это значение)

[input]
pointer_gain = 1.0
edge_dwell_ms = 0                    # задержка у края против случайного перехода
edge_hysteresis_px = 8
takeover_threshold_px = 12           # receiver: физическое движение для takeover
repeat_mode = "receiver_software"    # "receiver_native" | "receiver_software"
require_emergency_hotkey = true      # Wayland-источник без портала GlobalShortcuts не входит в Remote
takeover_detection = "auto"          # "auto" | "evdev" | "off"; "evdev" требует членства в группе input

[input.hotkeys]                     # пусто отключает действие, кроме emergency_release
emergency_release = "Ctrl+Alt+Shift+F12"
switch_next = "Ctrl+Alt+Shift+Right"
return_local = "Ctrl+Alt+Shift+Left"
claim_ownership = "Ctrl+Alt+Shift+Home"
game_guard_toggle = "Ctrl+Alt+Shift+G"

[game_guard]
mode = "auto"                       # auto | always | off; Wayland: ручной always/off
block_apps = []                      # до 64 exe basename/WM_CLASS, до 128 bytes, без путей
allow_apps = []                      # приоритет над block_apps в auto

[clipboard]
enabled = false                      # opt-in на обеих сторонах; на Wayland доступен только пока жива портальная сессия
skip_secret_marked = true            # маркеры менеджеров паролей
max_bytes = 1048576
rate_bytes_per_s = 262144
transfer = "on_offer"                # "on_offer" | "on_focus_enter"
policy = "follow"                    # "follow": только после перехода ввода; "broadcast": всем узлам
settle_ms = 700                      # ожидание фокуса; при загрузке ограничивается 200..3000 мс

[ui]
language = "ru"                      # "ru" | "en"
autostart = false                    # включается только после успешного теста

[appearance]
# Меняются без перезапуска в панели «Внешний вид»; состояние подтверждает служба.
edge_effects = true                 # ASCII-полоска у связанного края и «выдох» на другой машине
hide_remote_cursor = true           # прятать курсор здесь, пока ввод на другой машине (Windows)

[log]
level = "info"                       # никогда не логирует клавиши и clipboard
max_file_mb = 5
max_files = 5

# ---- Layout: правит любой узел, сериализует координатор (текущий owner) ----
[topology]
revision = 7
author = "…"                        # node_id автора применённой ревизии
max_seen_revision = 7               # монотонный пол; ревизия назад не идёт
max_seen_author = "…"               # автор, применённый вместе с max_seen_revision

[[topology.displays]]                # снимок для GUI; источник истины — агент узла
node = "self"                       # здесь: node_id этого узла
id = "edid:7a3f…"
logical = [0, 0, 2560, 1440]
primary = true

# Граф переходов произвольной формы; узел A в середине, B справа от A.
[[topology.links]]
id = "win-right-to-a-left"
from = { node = "self", display = "edid:7a3f…", edge = "right", start = 200, end = 1240 }
to   = { node = "peer:9c1e…", display = "eDP-1", edge = "left", start = 0, end = 1080 }
bidirectional = true

[[topology.links]]
id = "a-right-to-b-left"
from = { node = "peer:9c1e…", display = "eDP-1", edge = "right", start = 0, end = 1080 }
to   = { node = "peer:4f70…", display = "eDP-1", edge = "left", start = 0, end = 1080 }
bidirectional = true

# Необязательный общий звук: сопряжение не выдаёт аудиоразрешений.
# Секцию можно опустить: её значения по умолчанию не записываются.
# Здесь показан выключенный Source с примером ID, без согласий и открытых устройств.
# Откат: протокол остаётся 1/0, config_version — 2, но старые программы
# не понимают [audio]. До включения сохраните совместимую резервную копию.
# При первом сохранении непустого audio в существующий файл без audio
# однократно создаётся отсутствующий config.toml.pre-audio.
# Для вручную добавленного [audio] этой копии может не быть; .bak вращается
# и не заменяет её. Перед откатом остановите Bifrost и восстановите совместимый файл.
[audio]
enabled = false
role = "source"                     # off (по умолчанию) | source | listener
# Выберите доверенный приёмник в GUI; ID — 64 hex, не имя/IP и не разрешение.
listener_node_id = "1111111111111111111111111111111111111111111111111111111111111111"
# group_id отсутствует: группа задаётся выбранным приёмником по доверенной связи.
# При явном false сохранённый авторазрешённый group_id не фиксирует группу.
group_id_override = false           # следовать выбранному Listener, даже с group_id
# Ручная фиксация — только Source Advanced: измените group_id_override выше на true
# и задайте group_id (32 hex), например:
# group_id = "00112233445566778899aabbccddeeff"
# В старых Source без group_id_override непустой group_id остаётся ручной фиксацией.
media_port = 47903                  # UDP 1..65535, кроме discovery 47902; 0 запрещён
# В stateful LAN обычно достаточно исходящих проб после закреплённого TCP-соединения.
# Это не обход брандмауэра/AP/VPN. При неудачной проверке пути разрешите этот UDP-порт
# на приёмнике только от LAN-адреса источника; TCP 47901 нужен хотя бы в одну сторону.
profile = "auto"                    # auto | ethernet | wifi; Wi-Fi буфер больше
mode = "mix_all"                    # mix_all | follow_focus
allow_send_to = []                  # согласие Source -> единственный выбранный Listener
allow_system_audio_from = []        # согласие Listener <- Source, максимум 3 источника
# peers по умолчанию пуст. Пример [[audio.peers]] ниже; не задавайте одновременно
# peers = [] и [[audio.peers]]: это два определения одного TOML-ключа.
output_device = { kind = "follow_default", role = "multimedia" }
# Альтернатива: { kind = "follow_default", role = "communications" }
# Закрепление устройства: { kind = "stable_id", id = "<ID из списка устройств>" }
# Выбор выхода не меняет системное устройство по умолчанию.
output_fallback_to_default = false
capture_device = { kind = "default_monitor" } # системный monitor, не микрофон
# Закрепление monitor: { kind = "stable_id", id = "<ID из списка устройств>" }
resume_system_audio = false
focus_debounce_ms = 250             # при загрузке ограничивается 100..2000 с предупреждением
focus_ramp_ms = 150                 # при загрузке ограничивается 20..1000 с предупреждением
background_gain_db = -18.0          # конечное число -60..0; при загрузке ограничивается
background_mute = false

[audio.microphone]
control_enabled = false             # отдельное согласие на mute/PTT, не передачу звука
streaming_enabled = false           # true отклоняется: передача микрофона отложена
experimental_acknowledged = false
capture_device = { kind = "follow_default", role = "multimedia" }
# Для коммуникационного default явно задайте role = "communications".
# Только Listener управляет своим физическим микрофоном; Source пересылает команды.
# Для удалённого управления нужны control_enabled и разрешение Source на Listener.
allow_default_mic_changes = false
virtual_device = ""                 # виртуальная маршрутизация отложена; оставьте пустым
muted = true                        # предпочтение, не снимок состояния ОС
ptt_enabled = false
ptt_hotkey = ""                      # при ptt_enabled=true: пусто — GUI PTT, hotkey — глобальная
# pinned_target_node_id отсутствует: зависимый выбор микрофонной цели/UX отложен.
# Не задавайте его для виртуальной маршрутизации.

# Пример записи — раскомментировать только после выбора роли и доверенного пира.
# Источник может дать media-control только своему единственному Listener; по умолчанию false.
# Listener разрешает Source управлять своим микрофоном через allow_mic_control.
# Медиа- и микрофонные разрешения независимы и по умолчанию выключены.
# gain_percent/muted — местные настройки Listener; для Source оставьте 100/false.
# [[audio.peers]]
# node_id = "1111111111111111111111111111111111111111111111111111111111111111"
# allow_media_control = false
# allow_mic_control = false          # только Listener, для доверенного Source
# gain_percent = 100                 # целое 0..100
# muted = false
