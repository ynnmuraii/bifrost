[package]
name = "transport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LAN Workspace transport: pinned TLS links, mesh dedup, liveness (KVM-032/070)"

[lints]
workspace = true

[dependencies]
clipboard = { path = "../clipboard" }
geometry = { path = "../geometry" }
identity = { path = "../identity" }
input-model = { path = "../input-model" }
focus-router = { path = "../focus-router" }
protocol = { path = "../protocol" }
logging = { path = "../logging" }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
thiserror = "2"
socket2.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# `SO_EXCLUSIVEADDRUSE` is a WinSock constant; transport sets it in `bind_listener`.
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }
