[package]
name = "lws-tray"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
config = { path = "../../crates/config" }
ipc = { path = "../../crates/ipc" }
protocol = { path = "../../crates/protocol" }
ui-text = { path = "../../crates/ui-text" }
lws-desktop = { path = "../lws-desktop" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
