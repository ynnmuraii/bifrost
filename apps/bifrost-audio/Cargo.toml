[package]
name = "bifrost-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bifrost isolated opt-in audio child role"

[lints]
workspace = true

[dependencies]
audio-backend = { path = "../../crates/audio-backend" }
audio-model = { path = "../../crates/audio-model" }
audio-media = { path = "../../crates/audio-media" }
ipc = { path = "../../crates/ipc" }
protocol = { path = "../../crates/protocol" }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
ring = "0.17"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
platform-audio-linux = { path = "../../crates/platform-audio-linux" }

[target.'cfg(windows)'.dependencies]
platform-audio-win = { path = "../../crates/platform-audio-win" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
rtrb = "0.3"
windows-sys = { workspace = true, features = ["Win32_System_Performance"] }
