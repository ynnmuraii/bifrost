[package]
name = "lws-agent"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
# The clipboard vocabulary and limits (`Marker`, `MAX_BYTES`, `sha256`) — pure, no OS:
# the agent owns the local selection, and this crate is what decides what may be applied
# (ADR-008). The per-platform halves are behind `platform-win`/`platform-x11`.
clipboard = { path = "../../crates/clipboard" }
input-model = { path = "../../crates/input-model" }
ipc = { path = "../../crates/ipc" }
platform-probe = { path = "../../crates/platform-probe" }
platform-wayland = { path = "../../crates/platform-wayland" }
platform-win = { path = "../../crates/platform-win" }
platform-x11 = { path = "../../crates/platform-x11" }
protocol = { path = "../../crates/protocol" }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

# Only to classify portal failures for `AgentError.code`: `ashpd::Error::Response(
# ResponseError::Cancelled)` is what a dismissed permission dialog looks like, and
# `docs/03-architecture.md` S8 requires `PORTAL_DENIED` (not generic text) plus the
# interface name. The crate is already in the tree through `platform-wayland`, and it
# is Linux-only (`std::os::unix`), so it must not be an unconditional dependency.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.13"
