[package]
name = "bifrost-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clipboard = { path = "../../crates/clipboard" }
config = { path = "../../crates/config" }
edgefx = { path = "../../crates/edgefx" }
logging = { path = "../../crates/logging" }
focus-router = { path = "../../crates/focus-router" }
geometry = { path = "../../crates/geometry" }
identity = { path = "../../crates/identity" }
input-model = { path = "../../crates/input-model" }
ipc = { path = "../../crates/ipc" }
bifrost-desktop = { path = "../bifrost-desktop" }
platform-probe = { path = "../../crates/platform-probe" }
protocol = { path = "../../crates/protocol" }
# `portal-restore.toml` is a small TOML document owned by core (serde + toml are
# already in the tree through `config`, so this adds no new crates).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transport = { path = "../../crates/transport" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# Job objects: the agent must not outlive core (see `src/job.rs`).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
