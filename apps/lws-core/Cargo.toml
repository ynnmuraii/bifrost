[package]
name = "lws-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
config = { path = "../../crates/config" }
focus-router = { path = "../../crates/focus-router" }
geometry = { path = "../../crates/geometry" }
identity = { path = "../../crates/identity" }
input-model = { path = "../../crates/input-model" }
ipc = { path = "../../crates/ipc" }
platform-probe = { path = "../../crates/platform-probe" }
protocol = { path = "../../crates/protocol" }
# `portal-restore.toml` is a small TOML document owned by core (serde + toml are
# already in the tree through `config`, so this adds no new crates).
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transport = { path = "../../crates/transport" }

[lints]
workspace = true
