[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# `SO_EXCLUSIVEADDRUSE` on Windows (see transport::manager::bind_listener) is not exposed by
# tokio's `TcpSocket`; socket2 is the smallest crate that sets listener flags portably.
socket2 = { version = "0.6", features = ["all"] }
windows-sys = { version = "0.61", default-features = false }
