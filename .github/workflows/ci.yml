name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Match the required workspace gate and bound concurrent native linker work.
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both operating systems run the whole workspace: the Unix-socket
        # transport of crates/ipc, platform-x11, platform-wayland and
        # platform-probe only execute on ubuntu-latest, where their cfg gates
        # select them; on Windows the same commands compile them to no tests.
        # `apps/lws-gui` is that same shape for a different reason: the window
        # itself only opens where a human is — never in this workflow — and
        # everything the crate does headlessly (the view model, the screens
        # drawn into an offscreen `egui::Context`, and its two-core test) runs
        # on both runners.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The toolchain is not pinned here on purpose: rust-toolchain.toml in the
      # repository is the source of truth and names the channel "stable", the
      # same channel this action installs. `components`/`targets` are repeated
      # only so they exist before cargo runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      # The only native code in the dependency graph is ring (rustls), which
      # needs a C compiler and an archiver for its C and assembly parts;
      # binutils supplies `nm` for the agent symbol check below. Everything else
      # on Linux is pure Rust: x11rb builds its RustConnection, and zbus, ashpd
      # and reis have no C counterpart, so no X11/Wayland -dev packages are
      # installed and no X or D-Bus session is needed — the platform tests assert
      # pure contracts against injected environment data.
      #
      # Xvfb is the one exception, and `docs/06-development-plan.md` («CI и
      # выпуск») asks for it: «Linux runner Xvfb/XTest проверяет часть
      # injection/selection». The fault-injection harness drives two real cores
      # through transitions, and a runner without a session reports
      # `UnsupportedSession`, so the agent advertises no capabilities and every
      # switch is refused. `xauth` comes with `xvfb-run`.
      #
      # `apps/lws-gui` adds nothing to this list, and that is why its window is
      # eframe/egui on the `glow` renderer: glutin opens GLX/EGL through
      # `libloading`, `x11-dl` opens `libX11` the same way, and `wayland-dlopen`
      # (pulled by the `winit` entry in `apps/lws-gui/Cargo.toml`) opens
      # `libwayland-client` — so no X11/Wayland library is a *link-time*
      # dependency and no `-dev` package or GL driver has to exist here. What the
      # workflow builds and runs headlessly is the view model, the screens drawn
      # into an offscreen `egui::Context`, and one test against two real cores;
      # the offscreen PNGs are an example (`cargo run -p lws-gui --example
      # shots`), which `cargo test` compiles but never runs.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils xvfb xauth

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ADR-009: the product is MIT, so every crate that ends up in a shipped binary must be
      # redistributable under MIT-compatible terms. `deny.toml` is that policy: it lists the
      # licences we audited (`docs/08-reuse-and-licenses.md`) and denies everything else by
      # omission, so GPL/LGPL/AGPL cannot enter the graph unnoticed. The matching notice list a
      # distributed binary has to carry is `licenses/THIRD_PARTY_NOTICES.md`, generated with
      # cargo-about from `about.toml`.
      #
      # It runs on both runners on purpose: the target graphs differ (Windows pulls
      # `windows`/`clipboard-win`, Linux `zbus`/`ashpd`/`reis`/`x11rb`), and a licence the
      # Windows graph never sees still has to be acceptable for the Linux build. That is also
      # why cargo-deny is installed as a prebuilt binary (`taiki-e/install-action` supports
      # Windows) instead of `EmbarkStudios/cargo-deny-action`: the latter is a Docker action
      # and dies with «Container action is only supported on Linux» on the Windows runner.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences
        run: cargo deny --all-features check licenses

      # `cargo test` builds a package's *test* targets, and the two-core harnesses in
      # `apps/multideskflow/tests` get the binary from `CARGO_BIN_EXE_multideskflow`. The
      # window's own two-core test (`apps/lws-gui/tests/cores.rs`) is a test of another package
      # and looks for `multideskflow` in target/debug, as does the core when it spawns its
      # agent (`multideskflow agent …` from its own executable). Build the workspace first.
      - name: Build
        run: cargo build --workspace

      # docs/03-architecture.md, agent rule 1: the agent owns no network sockets.
      #
      # The agent used to be a separate executable, so the Windows build could prove it at
      # link time (no winsock import) and the Linux build by a symbol list. The one
      # `multideskflow` executable links winsock for the core, and a symbol list over it says
      # nothing about the agent, so both link-time checks are gone. What replaces them runs
      # on both runners, before `Test` so that a red suite cannot hide it:
      #
      #  * `cargo tree -p lws-agent -e normal` must not contain the transport/TLS/identity
      #    crates, the window or the core, nor the usual network clients (a denylist);
      #  * no source file of `apps/lws-agent` may name a TCP/UDP socket type;
      #  * the agent's run-time guard (`lws_agent::netguard`, which also runs in every real
      #    agent process, at start and every two seconds) must report a TCP/UDP socket of
      #    this process when there is one and none when there is not.
      #
      # All three live in `apps/lws-agent/tests/no_network.rs`.
      - name: Agent owns no network sockets
        run: cargo test --locked -p lws-agent --test no_network


      # `LWS_KEEP_ROOTS=1` stops the harness from deleting its per-test root
      # (`unique_dir`), and the roots are then uploaded as an artifact below: a
      # flaky two-core or three-node test is diagnosed from the cores' own logs
      # and configs, not from a rerun. The harness has no base-dir variable of its
      # own — it calls `std::env::temp_dir()` — so the location is chosen through
      # TMPDIR (Linux) and TMP/TEMP (Windows), which is exactly how
      # `std::env::temp_dir()` resolves. The directory is created first: `xvfb-run`
      # runs `mktemp -d` in TMPDIR and would fail if it did not exist.
      - name: Prepare diagnostics root
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\lws-roots" | Out-Null

      - name: Prepare diagnostics root
        if: runner.os == 'Linux'
        run: mkdir -p "$RUNNER_TEMP/lws-roots"

      - name: Linux resources before test linking
        if: runner.os == 'Linux'
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
          du -sh target


      # Windows runners have a session; Linux ones need Xvfb (above). The fault
      # suite in `apps/lws-core/tests/fault_injection.rs` is what makes this
      # matter: it spawns two cores and waits for real transitions.
      - name: Test
        if: runner.os == 'Windows'
        env:
          LWS_KEEP_ROOTS: "1"
          TMP: ${{ runner.temp }}\lws-roots
          TEMP: ${{ runner.temp }}\lws-roots
        run: cargo test --workspace

      - name: Test
        if: runner.os == 'Linux'
        env:
          LWS_KEEP_ROOTS: "1"
          TMPDIR: ${{ runner.temp }}/lws-roots
        # Keep the server alive between short-lived probe clients. Xvfb otherwise resets
        # when its last client disconnects, racing the next core's capability probe.
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --workspace

      - name: Linux resources after link failure
        if: failure() && runner.os == 'Linux'
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
          du -sh target


      # The kept roots are the point of `LWS_KEEP_ROOTS` above: one directory per
      # harness (`lws-<label>-<pid>-<n>`) with each core's log, config and state.
      # Only on failure, so a green run uploads nothing.
      - name: Upload harness roots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lws-roots-${{ runner.os }}
          path: ${{ runner.temp }}/lws-roots
          if-no-files-found: ignore
