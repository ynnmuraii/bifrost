name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both operating systems run the whole workspace: the Unix-socket
        # transport of crates/ipc, platform-x11, platform-wayland and
        # platform-probe only execute on ubuntu-latest, where their cfg gates
        # select them; on Windows the same commands compile them to no tests.
        # `apps/lws-gui` is that same shape for a different reason: the window
        # itself only opens where a human is — never in this workflow — and
        # everything the crate does headlessly (the view model, the screens
        # drawn into an offscreen `egui::Context`, and its two-core test) runs
        # on both runners.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The toolchain is not pinned here on purpose: rust-toolchain.toml in the
      # repository is the source of truth and names the channel "stable", the
      # same channel this action installs. `components`/`targets` are repeated
      # only so they exist before cargo runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      # The only native code in the dependency graph is ring (rustls), which
      # needs a C compiler and an archiver for its C and assembly parts;
      # binutils supplies `nm` for the agent symbol check below. Everything else
      # on Linux is pure Rust: x11rb builds its RustConnection, and zbus, ashpd
      # and reis have no C counterpart, so no X11/Wayland -dev packages are
      # installed and no X or D-Bus session is needed — the platform tests assert
      # pure contracts against injected environment data.
      #
      # Xvfb is the one exception, and `docs/06-development-plan.md` («CI и
      # выпуск») asks for it: «Linux runner Xvfb/XTest проверяет часть
      # injection/selection». The fault-injection harness drives two real cores
      # through transitions, and a runner without a session reports
      # `UnsupportedSession`, so the agent advertises no capabilities and every
      # switch is refused. `xauth` comes with `xvfb-run`.
      #
      # `apps/lws-gui` adds nothing to this list, and that is why its window is
      # eframe/egui on the `glow` renderer: glutin opens GLX/EGL through
      # `libloading`, `x11-dl` opens `libX11` the same way, and `wayland-dlopen`
      # (pulled by the `winit` entry in `apps/lws-gui/Cargo.toml`) opens
      # `libwayland-client` — so no X11/Wayland library is a *link-time*
      # dependency and no `-dev` package or GL driver has to exist here. What the
      # workflow builds and runs headlessly is the view model, the screens drawn
      # into an offscreen `egui::Context`, and one test against two real cores;
      # the offscreen PNGs are an example (`cargo run -p lws-gui --example
      # shots`), which `cargo test` compiles but never runs.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils xvfb xauth

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test` builds a package's *test* targets; it does not produce the plain
      # `lws-agent` binary. `lws-core run` spawns that binary at startup and exits with
      # «cannot spawn …: No such file or directory» when it is missing, and every test
      # that starts a core — the control channel under load, the fault-injection harness —
      # then fails on a clean checkout. Build the workspace first.
      - name: Build
        run: cargo build --workspace

      # The two symbol checks come before `Test` on purpose: they need nothing
      # but the binaries `Build` just produced, and GitHub skips every later step
      # once one fails. While the test suite is red the agent invariant would
      # otherwise never be checked at all.

      # docs/03-architecture.md, rule 1: «Нет сетевых сокетов. В Windows-сборке не
      # линкуется winsock; на Linux — проверка в CI по списку символов.»
      #
      # Windows states it exactly: the import table of the agent must not name
      # winsock at all. `SendInput` from user32 is expected and is why the pattern
      # matches DLL names and unambiguous winsock entry points by name rather than
      # the substrings "send" or "connect".
      - name: Agent links no winsock
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p lws-agent
          $host_triple = (rustc -vV | Select-String '^host: ') -replace '.*host: ', ''
          $readobj = Join-Path (rustc --print sysroot) "lib\rustlib\$host_triple\bin\llvm-readobj.exe"
          if (-not (Test-Path $readobj)) { throw "llvm-readobj is missing; install the llvm-tools component" }
          $forbidden = & $readobj --coff-imports target\debug\lws-agent.exe |
            Select-String -Pattern 'ws2_32|wsock32|mswsock|WSAStartup|WSACleanup|WSAGetLastError|closesocket|ioctlsocket|WSAPoll|WSARecv|WSASend|__WSAFDIsSet'
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_ }
            throw 'lws-agent links winsock; rule 1 forbids network sockets in the agent'
          }
          Write-Host 'agent import table contains no winsock entry point'

      # Linux needs nuance, and this step records it instead of pretending a
      # symbol list can separate AF_UNIX from AF_INET: `socket`, `connect`,
      # `socketpair` and the message calls are the documented local transports
      # (the core<->agent socketpair, the GUI Unix socket), and `getaddrinfo`,
      # `freeaddrinfo` and `getsockopt` arrive with the X11 and EIS clients that
      # must dial their compositor. Every symbol the agent may legitimately have
      # is listed below, so the check is an approval gate: a new network symbol
      # fails the build and has to be added here on purpose. What it cannot catch
      # is a TCP client reusing `socket`/`connect` — see the note in the report.
      - name: Agent links only the documented local-transport symbols
        if: runner.os == 'Linux'
        run: |
          cargo build -p lws-agent
          printf '%s\n' connect freeaddrinfo getaddrinfo getsockopt recv recvmsg send sendmsg shutdown socket socketpair | sort > /tmp/allowed-network-symbols
          nm -u target/debug/lws-agent | awk '{print $NF}' \
            | grep -E '(socket|connect|bind|listen|accept|send|recv|shutdown|addrinfo|gethostby|inet_|if_name|sockopt|nameinfo|servby)' \
            | sort -u > /tmp/agent-network-symbols
          echo "network symbols in lws-agent:"; sed 's/^/  /' /tmp/agent-network-symbols
          unexpected=$(comm -13 /tmp/allowed-network-symbols /tmp/agent-network-symbols)
          if [ -n "$unexpected" ]; then
            echo "::error::lws-agent gained network symbols that are not on the documented list:"
            echo "$unexpected"
            echo "If a new symbol is legitimate for a local transport, add it to the list in this step and say why."
            exit 1
          fi

      # `LWS_KEEP_ROOTS=1` stops the harness from deleting its per-test root
      # (`unique_dir`), and the roots are then uploaded as an artifact below: a
      # flaky two-core or three-node test is diagnosed from the cores' own logs
      # and configs, not from a rerun. The harness has no base-dir variable of its
      # own — it calls `std::env::temp_dir()` — so the location is chosen through
      # TMPDIR (Linux) and TMP/TEMP (Windows), which is exactly how
      # `std::env::temp_dir()` resolves. The directory is created first: `xvfb-run`
      # runs `mktemp -d` in TMPDIR and would fail if it did not exist.
      - name: Prepare diagnostics root
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\lws-roots" | Out-Null

      - name: Prepare diagnostics root
        if: runner.os == 'Linux'
        run: mkdir -p "$RUNNER_TEMP/lws-roots"

      # Windows runners have a session; Linux ones need Xvfb (above). The fault
      # suite in `apps/lws-core/tests/fault_injection.rs` is what makes this
      # matter: it spawns two cores and waits for real transitions.
      - name: Test
        if: runner.os == 'Windows'
        env:
          LWS_KEEP_ROOTS: "1"
          TMP: ${{ runner.temp }}\lws-roots
          TEMP: ${{ runner.temp }}\lws-roots
        run: cargo test --workspace

      - name: Test
        if: runner.os == 'Linux'
        env:
          LWS_KEEP_ROOTS: "1"
          TMPDIR: ${{ runner.temp }}/lws-roots
        run: xvfb-run -a cargo test --workspace

      # The kept roots are the point of `LWS_KEEP_ROOTS` above: one directory per
      # harness (`lws-<label>-<pid>-<n>`) with each core's log, config and state.
      # Only on failure, so a green run uploads nothing.
      - name: Upload harness roots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lws-roots-${{ runner.os }}
          path: ${{ runner.temp }}/lws-roots
          if-no-files-found: ignore
