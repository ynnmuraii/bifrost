name: CI

# The two runners gate different things, and that is deliberate. The ubuntu job
# is the full one and runs on every push: it is the cheap runner (1x minutes,
# ~8 minutes) and it is where the whole workspace is exercised, including the
# multi-process harnesses of `apps/multideskflow/tests` and the Xvfb session
# they need. The windows job is the expensive one (2x minutes) and keeps on the
# push only what Windows alone can answer — see the `Test` steps at the bottom.
# Its full run lives in `nightly.yml`.
on:
  push:
    branches: [main]
    # A push that touches neither source nor a build input has nothing here to
    # compile or assert: `cargo build`, `clippy`, `test` and `deny` read no
    # Markdown, no doc tree and no packaging text.
    #
    # `icon.ico`, `icon-32.rgba` and `apps/lws-gui/assets/fonts/*.ttf` are
    # deliberately *not* in this list. `apps/multideskflow/build.rs` embeds the
    # first into the executable (and declares it `rerun-if-changed`), and the
    # other two are `include_bytes!` inputs, so all three are build inputs like
    # any `.rs` file. The PNG and SVG copies of the icon are not:
    # `apps/multideskflow/assets/generate_icons.py` generates them from
    # `icon.svg`, only `release.yml` opens them, and nothing in the build does.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'packaging/README_RU.txt'
      - '.gitignore'
      - '**/*.png'
      - '**/*.svg'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'packaging/README_RU.txt'
      - '.gitignore'
      - '**/*.png'
      - '**/*.svg'

# One run per ref, and a newer push cancels the one it supersedes. This
# repository pushes to `main` often and reruns flaky jobs, and without this a
# burst of pushes leaves a backlog of runs that each bill for their whole
# length. Cancelling does not weaken the gate: a cancelled job is only billed
# for the minutes it ran, and the tree that survives the cancellation is the
# newest one, which is the only one whose result still matters.
#
# The group is the ref, so a pull request and a push to `main` never cancel
# each other, and `nightly.yml` has a group of its own and never cancels.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Match the required workspace gate and bound concurrent native linker work.
  CARGO_BUILD_JOBS: 2
  # Every run restores a dependency cache and rebuilds a handful of crates, so
  # incremental compilation writes session data that no later run reads; it also
  # feeds the 10 GB cache budget with artifacts `Swatinem/rust-cache` would strip
  # anyway (it sets this variable itself). Off, explicitly, so the setting cannot
  # drift from what the cache holds.
  CARGO_INCREMENTAL: 0
  # This workflow links the workspace twice: `Build` produces the binaries and
  # `Test` re-links every crate as a test binary. On ubuntu-latest the second set
  # used to grow `target/` from 4.5 GiB to 12 GiB on a 72 GiB runner that the
  # cache restore leaves at 8 GiB free, and the linker died with
  # `collect2: fatal error: ld terminated with signal 7 [Bus error]` — GNU ld
  # mmaps the output file, so a page fault on a full filesystem is SIGBUS, not
  # ENOSPC (run 38619266437, linking the `spike_probe` example). Debug info is
  # most of that 12 GiB and CI never steps through a binary, so the dev and test
  # profiles carry none of it; panics still name the function through the symbol
  # table. This does not change what the gate compiles, runs or asserts.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hang must not be able to bill a runner for hours: run 38805173105 sat in
    # the Windows `Test` step for 90.8 minutes (its job ran 20:50→22:30, 100
    # minutes at 2x = 200 billed minutes) until it was cancelled by hand. These
    # budgets are four times the observed job lengths (Windows 18.6 min, Ubuntu
    # 7.8 min in run 38865434698); they are meant to fail, not to be reached.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Both runners configure the whole workspace — `cargo fmt`, `cargo
        # clippy --workspace --all-targets` and `cargo build --workspace` cover
        # every crate on both, so a `cfg(windows)`-only compile error or lint is
        # still caught on the push. What differs is which tests each one runs:
        # ubuntu runs the whole workspace (the Unix-socket transport of
        # crates/ipc, platform-x11, platform-wayland and platform-probe only
        # execute there, where their cfg gates select them, and the Xvfb session
        # the fault harnesses need exists only there), while windows runs the
        # unit tests and the Windows-specific suites — the `Test` steps at the
        # bottom carry the measurements behind that split.
        include:
          - os: ubuntu-latest
            timeout: 20
          - os: windows-latest
            timeout: 30
    steps:
      - uses: actions/checkout@v4

      # The toolchain is not pinned here on purpose: rust-toolchain.toml in the
      # repository is the source of truth and names the channel "stable", the
      # same channel this action installs. `components`/`targets` are repeated
      # only so they exist before cargo runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          # `v1`, not the default `v0-rust`: that namespace holds 4.5 GiB of
          # DWARF-laden artifacts built before the profile settings above, which
          # cargo would rebuild anyway (debuginfo is part of the fingerprint)
          # after the restore had spent the disk this build needs.
          prefix-key: v1-rust
          # `shared-key` replaces the automatic per-job part of the key, and
          # names the runner's own target directory: the ubuntu job and the
          # windows job never share one. It is what `nightly.yml` points at to
          # restore *this* job's cache — its Windows job names the same string —
          # because a nightly that rebuilt the dependency graph from scratch
          # every night would cost more than the nightly saves.
          shared-key: ${{ matrix.os }}
          # A pull request restores but never writes: its `target/` belongs to a
          # synthetic merge commit, and `main` is the tree whose cache is worth
          # keeping. It is also the only tree that exists at 03:00 UTC.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Defence in depth for the SIGBUS above: a restored cache, a bigger
      # workspace or a runner image with less free space must not end in the
      # linker. Below the floor it is cheaper to rebuild from scratch than to
      # die while linking, so the cache is dropped and the build is honest about
      # starting empty. The floor is what the two target sets need without debug
      # info; the `Linux resources …` steps below report the real numbers.
      - name: Linux free space guard
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # `-P` prints the POSIX one-line-per-filesystem form, so the second
          # line is the workspace and its fourth field the available KiB. (GNU
          # df refuses `-P` together with `--output`, and a guard that reads
          # nothing must not be read as "nothing free".)
          available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          case "$available" in
            ''|*[!0-9]*) echo "cannot read the free space of $GITHUB_WORKSPACE: '$available'" >&2; exit 1 ;;
          esac
          echo "$((available / 1024)) MiB free in the workspace filesystem"
          if [ "$available" -lt 6291456 ]; then
            echo "less than 6 GiB free: dropping the restored target cache"
            cargo clean
          fi
          df -h "$GITHUB_WORKSPACE"

      # The only native code in the dependency graph is ring (rustls), which
      # needs a C compiler and an archiver for its C and assembly parts;
      # binutils supplies `nm` for the agent symbol check below. Everything else
      # on Linux is pure Rust: x11rb builds its RustConnection, and zbus, ashpd
      # and reis have no C counterpart, so no X11/Wayland -dev packages are
      # installed and no X or D-Bus session is needed — the platform tests assert
      # pure contracts against injected environment data.
      #
      # Xvfb is the one exception, and `docs/06-development-plan.md` («CI и
      # выпуск») asks for it: «Linux runner Xvfb/XTest проверяет часть
      # injection/selection». The fault-injection harness drives two real cores
      # through transitions, and a runner without a session reports
      # `UnsupportedSession`, so the agent advertises no capabilities and every
      # switch is refused. `xauth` comes with `xvfb-run`.
      #
      # `apps/lws-gui` adds nothing to this list, and that is why its window is
      # eframe/egui on the `glow` renderer: glutin opens GLX/EGL through
      # `libloading`, `x11-dl` opens `libX11` the same way, and `wayland-dlopen`
      # (pulled by the `winit` entry in `apps/lws-gui/Cargo.toml`) opens
      # `libwayland-client` — so no X11/Wayland library is a *link-time*
      # dependency and no `-dev` package or GL driver has to exist here. What the
      # workflow builds and runs headlessly is the view model, the screens drawn
      # into an offscreen `egui::Context`, and one test against two real cores;
      # the offscreen PNGs are an example (`cargo run -p lws-gui --example
      # shots`), which `cargo test` compiles but never runs.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils xvfb xauth

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ADR-009: the product is MIT, so every crate that ends up in a shipped binary must be
      # redistributable under MIT-compatible terms. `deny.toml` is that policy: it lists the
      # licences we audited (`docs/08-reuse-and-licenses.md`) and denies everything else by
      # omission, so GPL/LGPL/AGPL cannot enter the graph unnoticed. The matching notice list a
      # distributed binary has to carry is `licenses/THIRD_PARTY_NOTICES.md`, generated with
      # cargo-about from `about.toml`.
      #
      # It runs on the Linux runner only, and that is a budget decision, not a policy one: the
      # ubuntu job is the cheap one, and installing cargo-deny and checking the graph there is
      # ~20 seconds at 1x. The reason this step used to run on both runners is real — the two
      # graphs differ (Windows pulls `windows`/`clipboard-win`, Linux `zbus`/`ashpd`/`reis`/
      # `x11rb`) — and it is kept, once a day instead of thirteen times: `nightly.yml` runs this
      # same command on windows-latest against the Windows graph. It is also why cargo-deny is
      # installed as a prebuilt binary (`taiki-e/install-action` supports Windows) rather than
      # `EmbarkStudios/cargo-deny-action`: the latter is a Docker action and dies with
      # «Container action is only supported on Linux».
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences
        if: runner.os == 'Linux'
        run: cargo deny --all-features check licenses

      # `cargo test` builds a package's *test* targets, and the two-core harnesses in
      # `apps/multideskflow/tests` get the binary from `CARGO_BIN_EXE_multideskflow`. The
      # window's own two-core test (`apps/lws-gui/tests/cores.rs`) is a test of another package
      # and looks for `multideskflow` in target/debug, as does the core when it spawns its
      # agent (`multideskflow agent …` from its own executable). Build the workspace first.
      - name: Build
        run: cargo build --workspace

      # docs/03-architecture.md, agent rule 1: the agent owns no network sockets.
      #
      # The agent used to be a separate executable, so the Windows build could prove it at
      # link time (no winsock import) and the Linux build by a symbol list. The one
      # `multideskflow` executable links winsock for the core, and a symbol list over it says
      # nothing about the agent, so both link-time checks are gone. What replaces them runs
      # on both runners, before `Test` so that a red suite cannot hide it:
      #
      #  * `cargo tree -p lws-agent -e normal` must not contain the transport/TLS/identity
      #    crates, the window or the core, nor the usual network clients (a denylist);
      #  * no source file of `apps/lws-agent` may name a TCP/UDP socket type;
      #  * the agent's run-time guard (`lws_agent::netguard`, which also runs in every real
      #    agent process, at start and every two seconds) must report a TCP/UDP socket of
      #    this process when there is one and none when there is not.
      #
      # All three live in `apps/lws-agent/tests/no_network.rs`.
      - name: Agent owns no network sockets
        run: cargo test --locked -p lws-agent --test no_network


      # `LWS_KEEP_ROOTS=1` stops the harness from deleting its per-test root
      # (`unique_dir`), and the roots are then uploaded as an artifact below: a
      # flaky two-core or three-node test is diagnosed from the cores' own logs
      # and configs, not from a rerun. The harness has no base-dir variable of its
      # own — it calls `std::env::temp_dir()` — so the location is chosen through
      # TMPDIR (Linux) and TMP/TEMP (Windows), which is exactly how
      # `std::env::temp_dir()` resolves. The directory is created first: `xvfb-run`
      # runs `mktemp -d` in TMPDIR and would fail if it did not exist.
      - name: Prepare diagnostics root
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\lws-roots" | Out-Null

      - name: Prepare diagnostics root
        if: runner.os == 'Linux'
        # A *short* root, because a socket path cannot be longer than
        # `sockaddr_un.sun_path` (108 bytes) and two harnesses put their whole
        # temporary tree under it. `apps/lws-core`'s agent launcher builds
        # `<temp>/lws-core-agent-<pid>-<n>-<label>/lan-workspace/agent-<pid>-<n>.sock`,
        # which measures `<len(temp)> + 66 + 2 * <digits of pid>`: with
        # `$RUNNER_TEMP` (33) that fits a four-digit pid (107) and overflows on a
        # five-digit one (109), so run 38624252563 failed
        # `agent::launch_tests::successful_attach_keeps_the_token_until_stop_or_supervisor_drop`
        # with «path must be shorter than SUN_LEN» as soon as the runner's pids
        # passed 10000. `/tmp/lws-roots` (14) keeps the same path at 90 and
        # leaves room up to a seven-digit pid. Windows has no such limit.
        run: mkdir -p /tmp/lws-roots

      - name: Linux resources before test linking
        if: runner.os == 'Linux'
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
          du -sh target


      # The Windows runner is the expensive one (2x minutes), and the full
      # `cargo test --workspace` there is what its minutes have always gone to:
      # in run 38865434698 the `Test` step was 15.2 of the job's 18.6 minutes,
      # and 723 of its 759 seconds of test execution were the five multi-process
      # harnesses in `apps/multideskflow/tests` — `three_nodes` (287 s),
      # `fault_injection` (165 s), `clipboard` (110 s), `heartbeat_stress`
      # (64 s) and `layout` (35 s). Those harnesses are platform-neutral: they
      # spawn real cores, speak the real protocol and assert the same contracts
      # on either runner, and the ubuntu job runs every one of them on every
      # push in 267 s at 1x. Paying 2x for them a second time, a dozen times a
      # day, is where the month went.
      #
      # What stays on the push is what Windows alone can answer. The whole
      # workspace already had to compile, pass clippy and build above (under
      # `cfg(windows)`, which is where those lints and that code exist), and
      # these run only here:
      #
      #  * every crate's unit tests (`--lib --bins`), which is where the
      #    `cfg(windows)` units of `config`, `identity`, `ipc`, `transport` and
      #    `multideskflow` are — `--bins` because the app's own units live in
      #    `main.rs`, and a bin-only package has no lib target to select;
      #  * the suites of the crates whose subject is Windows: `platform-win`
      #    (Win32 capture, injection, clipboard, DPI), `lws-agent` (netguard,
      #    the launcher and the backend), `lws-tray`, `identity` (the DPAPI
      #    keystore), `config` (paths and first run) and `ipc` (the named-pipe
      #    transport, which `tests/windows_transport.rs` exercises).
      #
      # The full `cargo test --workspace` on windows-latest is not dropped: it
      # moves to `nightly.yml`, which runs it (plus the licences check against
      # the Windows graph) once a day when `main` has moved. `cargo test -p
      # lws-agent` below re-runs the no-network test that the step above already
      # ran alone — 3 seconds, kept so that the suite and the dedicated check
      # cannot drift apart.
      - name: Test (unit tests of every crate)
        if: runner.os == 'Windows'
        env:
          LWS_KEEP_ROOTS: "1"
          TMP: ${{ runner.temp }}\lws-roots
          TEMP: ${{ runner.temp }}\lws-roots
        run: cargo test --workspace --lib --bins

      - name: Test (Windows-specific suites)
        if: runner.os == 'Windows'
        env:
          LWS_KEEP_ROOTS: "1"
          TMP: ${{ runner.temp }}\lws-roots
          TEMP: ${{ runner.temp }}\lws-roots
        run: cargo test -p platform-win -p lws-agent -p lws-tray -p identity -p config -p ipc

      # Windows runners have a session; Linux ones need Xvfb (above). The fault
      # suite in `apps/lws-core/tests/fault_injection.rs` is what makes this
      # matter: it spawns two cores and waits for real transitions. It is also
      # why the full workspace run is kept on this runner on every push rather
      # than only in the nightly.
      - name: Test
        if: runner.os == 'Linux'
        env:
          LWS_KEEP_ROOTS: "1"
          TMPDIR: /tmp/lws-roots
        # Keep the server alive between short-lived probe clients. Xvfb otherwise resets
        # when its last client disconnects, racing the next core's capability probe.
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --workspace

      - name: Linux resources after link failure
        if: failure() && runner.os == 'Linux'
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
          du -sh target


      # The kept roots are the point of `LWS_KEEP_ROOTS` above: one directory per
      # harness (`lws-<label>-<pid>-<n>`) with each core's log, config and state.
      # Only on failure, so a green run uploads nothing.
      - name: Upload harness roots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lws-roots-${{ runner.os }}
          # Linux keeps its roots in `/tmp` so that socket paths fit (see
          # `Prepare diagnostics root` above); Windows uses the job's temp
          # directory, which has no length limit.
          path: ${{ runner.os == 'Linux' && '/tmp/lws-roots' || format('{0}/lws-roots', runner.temp) }}
          if-no-files-found: ignore
