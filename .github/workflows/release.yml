name: Bifrost Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the shipped glibc baseline at 2.35 or older.
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils
      - name: Build
        run: cargo build --locked --release -p bifrost
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and workspace version differ' }
          $name = "bifrost-$version-${{ matrix.platform }}"
          $out = Join-Path $env:RUNNER_TEMP 'dist'
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $out, $stage | Out-Null
          Copy-Item target/release/bifrost.exe "$out/$name.exe"
          Copy-Item target/release/bifrost.exe $stage
          Copy-Item packaging/README_RU.txt, packaging/release-signing-public-key.pem, LICENSE, licenses/THIRD_PARTY_NOTICES.md, crates/config/examples-data/config.example.toml $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$out/$name.zip"
          $info = (Get-Item "$out/$name.exe").VersionInfo
          if ($info.FileVersion -ne $version -or $info.ProductVersion -ne $version) { throw 'Wrong Windows version metadata' }
          & "$out/$name.exe" --version
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [ '${{ github.ref_type }}' = tag ] && [ '${{ github.ref_name }}' != "v$version" ]; then
            echo 'Tag and workspace version differ' >&2; exit 1
          fi
          name="bifrost-$version-${{ matrix.platform }}"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/share/icons/hicolor/scalable/apps" "$RUNNER_TEMP/dist"
          install -m 0755 target/release/bifrost packaging/install.sh "$stage/"
          cp packaging/README_RU.txt packaging/release-signing-public-key.pem LICENSE licenses/THIRD_PARTY_NOTICES.md crates/config/examples-data/config.example.toml packaging/bifrost.desktop "$stage/"
          install -m 0644 packaging/bifrost.svg "$stage/share/icons/hicolor/scalable/apps/bifrost.svg"
          for size in 16 20 24 32 40 48 64 256; do
            mkdir -p "$stage/share/icons/hicolor/${size}x${size}/apps"
            install -m 0644 "apps/bifrost/assets/icon-${size}.png" "$stage/share/icons/hicolor/${size}x${size}/apps/bifrost.png"
          done
          ldd --version
          objdump -T target/release/bifrost | grep -o 'GLIBC_[0-9.]*' | sort -Vu
          tar -czf "$RUNNER_TEMP/dist/$name.tar.gz" -C "$stage" .
          HOME="$RUNNER_TEMP/install-test" "$stage/install.sh"
          HOME="$RUNNER_TEMP/install-test" "$RUNNER_TEMP/install-test/.local/bin/bifrost" --version
          HOME="$RUNNER_TEMP/install-test" "$stage/install.sh" --uninstall
          test -z "$(find "$RUNNER_TEMP/install-test" -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Signed checksums and release notes
        shell: bash
        env:
          BIFROST_RELEASE_SIGNING_KEY: ${{ secrets.BIFROST_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BIFROST_RELEASE_SIGNING_KEY" ]; then
            echo 'Missing required secret BIFROST_RELEASE_SIGNING_KEY' >&2
            exit 1
          fi
          umask 077
          key=$(mktemp "$RUNNER_TEMP/bifrost-release-signing.XXXXXX.pem")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$BIFROST_RELEASE_SIGNING_KEY" > "$key"
          unset BIFROST_RELEASE_SIGNING_KEY
          (cd dist && sha256sum bifrost-* > SHA256SUMS.txt)
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS.txt -out dist/SHA256SUMS.txt.sig
          test "$(wc -c < dist/SHA256SUMS.txt.sig)" -eq 64
          openssl pkeyutl -verify -rawin -pubin -inkey packaging/release-signing-public-key.pem -in dist/SHA256SUMS.txt -sigfile dist/SHA256SUMS.txt.sig
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          awk -v version="$version" '$0 ~ "^## " version " —" { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.txt
          test -s release-notes.txt
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: |
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
          if-no-files-found: error
      - name: Publish
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Bifrost ${{ env.RELEASE_VERSION }}
          body_path: release-notes.txt
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
